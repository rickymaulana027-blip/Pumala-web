<style>

header{

 display:flex;align-items:center;gap:10px;font-size:13px;width:100%
}
nav button:hover{background:rgba(255,255,255,.08)}nav button.active{background:#1677ff;color:#fff;box-shadow:0 5px 14px rgba(22,119,255,.25)}
.nav-spacer{flex:1}
.nav-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:8px}
main{margin-left:230px;padding:96px 28px 35px;max-width:1450px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#fff,#f5f9ff);border-color:#dfeafa;padding:24px}
.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.section-title h2,.section-title h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat-card{padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 3px 12px rgba(20,48,84,.03)}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat{font-size:23px;font-weight:850}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.report-card{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff;box-shadow:var(--shadow)}
.report-card h3{margin:0 0 5px;font-size:15px}.report-card .big{font-size:24px;font-weight:850;margin-top:8px}.report-card .mini{font-size:12px;color:var(--muted)}
.report-card.green{border-top:4px solid var(--green)}.report-card.red{border-top:4px solid var(--red)}.report-card.blue{border-top:4px solid var(--primary)}.report-card.purple{border-top:4px solid var(--purple)}
.total-box{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border-radius:14px;background:#f4f8ff;border:1px solid #e0eaff;margin-top:14px}
.total{font-size:23px;font-weight:850;color:var(--primary2)}
.shortcut-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.shortcut{
 border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;min-height:108px;
 box-shadow:0 4px 13px rgba(20,48,84,.04);transition:.15s
}
.shortcut:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,48,84,.08)}
.shortcut:active{transform:scale(.98)}.shortcut-icon{font-size:25px}.shortcut h3{margin:8px 0 3px;font-size:14px}.shortcut p{margin:0;color:var(--muted);font-size:11px;line-height:1.35}
.menu-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1}
.category-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.category-row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:12px;font-weight:700}.category-row button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.pos-products{min-width:0}.cart-panel{position:sticky;top:88px;height:max-content}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.menu{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;box-shadow:0 4px 14px rgba(20,48,84,.05);overflow:hidden}
.menu-visual{height:108px;border-radius:13px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,#eaf3ff,#f8fbff);margin-bottom:11px}
.menu h3{margin:0 0 5px;font-size:14px;line-height:1.3}.price{font-weight:850;font-size:15px;color:var(--primary2)}
.menu-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.add-btn{width:34px;height:34px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:20px;font-weight:800}
.qtybox{display:flex;align-items:center;gap:7px;margin-top:10px}.qtybox button{width:34px;height:34px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:19px}.qtybox input{width:54px;text-align:center;padding:8px}
.cart-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.cart-item:last-child{border-bottom:0}
input,select{width:100%;padding:11px 12px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1677ff18}
label{display:block;font-size:11px;font-weight:750;margin:2px 0 5px;color:#526071}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:750;margin:3px 3px 3px 0}.btn.green{background:var(--green)}.btn.orange{background:var(--primary)}.btn.danger{background:var(--red)}
.material-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.material-item{padding:15px;background:#f8fafc;border:1px solid var(--line);border-radius:13px;font-weight:750;display:flex;justify-content:space-between}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{font-size:11px;color:#657185;background:#f8fafc}
.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timeline{display:grid;gap:10px}.timeline-item{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.status-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf7f0;color:#08783f;font-size:10px;font-weight:800}
.backup-box{text-align:center;padding:28px;border:2px dashed #cfdbea;border-radius:18px;background:#f9fbff}.backup-icon{font-size:48px}

/* lock screen */
.lock-screen{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#071d3b,#123f75);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-panel{width:min(360px,100%);text-align:center}.lock-title{font-size:25px;font-weight:800}.lock-subtitle{color:#b9cbe2;font-size:14px;margin:6px 0 18px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 25px}.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff}.pin-dot.filled{background:#fff}
.pin-error{height:20px;color:#ff9ea8;font-size:13px;margin-bottom:8px}.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:auto}.pin-btn{width:78px;height:78px;max-width:100%;justify-self:center;border-radius:50%;border:1px solid #52719a;background:#173c69;color:#fff;font-size:28px}.pin-btn:active{background:#2b5b8e;transform:scale(.96)}

@media(max-width:1050px){
 .shortcut-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos-layout{grid-template-columns:1fr}.cart-panel{position:static}.dashboard-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
 header{position:sticky;left:0;right:0;height:62px;padding:0 14px;top:0}.header-inner{justify-content:flex-end}

 .sidebar-brand,.nav-spacer,.nav-bottom{display:none}nav button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:7px 4px;font-size:9px;min-width:0;flex:1;text-align:center}nav button span{display:block}
 main{margin-left:0;padding:14px 10px 92px}.card{padding:15px;border-radius:15px}.hero{padding:19px}.hero h2{font-size:21px}
 .shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.shortcut{min-height:100px;padding:12px}
 .grid,.form-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 1fr;gap:9px}.menu{padding:9px}.menu-visual{height:92px;font-size:42px}.menu h3{font-size:13px}.price{font-size:14px}
 .material-list{grid-template-columns:1fr 1fr}.menu-toolbar{align-items:stretch;flex-direction:column}.sync-dot{font-size:10px;padding:7px 9px}
 .pos-layout{grid-template-columns:1fr}
}

.input-like{min-height:42px;display:flex;align-items:center;padding:10px 12px;border:1px solid #dce5ef;border-radius:12px;background:#f8fafc;font-weight:700}.mini-panel{padding:12px 14px;border-radius:12px;background:#f4f8ff;border:1px solid #dce8f8}.empty{padding:18px;text-align:center;color:#7b8798}

/* ===== PUMALA MODERN BUSINESS THEME ===== */
:root{
 --primary:#0f9f6e;--primary2:#087b57;--navy:#073b32;--navy2:#0b5a48;
 --bg:#f4f8f6;--card:#ffffff;--text:#17342d;--muted:#71817b;--line:#e0ebe6;
 --green:#0f9f6e;--red:#e85b62;--orange:#f59e0b;--purple:#8064d9;--cyan:#159aa6;
 --shadow:0 10px 30px rgba(11,74,58,.07)
}
body{background:linear-gradient(180deg,#f6faf8 0%,#f1f7f4 100%);color:var(--text)}
header{height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(10,70,55,.04)}
.sync-dot{color:#0a7756;background:#eef9f4;border:1px solid #d6eee4;font-weight:700}
nav{width:250px;background:linear-gradient(180deg,#075744 0%,#063f35 55%,#05362f 100%);padding:20px 13px;box-shadow:8px 0 28px rgba(4,57,46,.08)}
.sidebar-brand{padding:5px 11px 26px}.sidebar-brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fff,#e9faf4);box-shadow:0 6px 16px rgba(0,0,0,.10)}
.sidebar-brand b{font-size:20px;letter-spacing:.3px}.sidebar-brand span{color:#a9d8ca}
nav button{color:#dcefe9;border-radius:12px;padding:12px 13px;font-size:13px}
nav button:hover{background:rgba(255,255,255,.09)}
nav button.active{background:linear-gradient(90deg,#16b57d,#0c9668);box-shadow:0 7px 18px rgba(4,180,123,.20);color:#fff}
main{margin-left:250px;padding:100px 30px 38px;max-width:1480px}
.card{border-color:var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#ffffff 0%,#ecfaf5 100%);border-color:#d5eee5;padding:25px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:rgba(15,159,110,.08)}
.hero h2{font-size:26px;position:relative;z-index:1}.hero p{color:var(--muted)}
.section-title h2,.section-title h3{letter-spacing:-.2px}
.stat-card,.report-card,.shortcut,.menu{border-color:var(--line);box-shadow:0 5px 18px rgba(9,76,59,.05)}
.report-card{border-top-width:4px}.report-card.blue{border-top-color:#159aa6}.report-card.purple{border-top-color:#8064d9}
.report-card.green{border-top-color:#0f9f6e}.report-card.red{border-top-color:#e85b62}
.total-box{background:#effaf5;border-color:#d9eee5}.total{color:var(--primary2)}
.shortcut{border-radius:17px;background:linear-gradient(180deg,#fff,#fbfdfc)}
.shortcut:hover{box-shadow:0 12px 26px rgba(9,76,59,.09);border-color:#cfe8df}
.shortcut-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#eaf8f3;font-size:22px}
.category-row button{border-color:var(--line);background:#fff}.category-row button.active{background:var(--primary);border-color:var(--primary)}
.menu{border-radius:18px;padding:11px}.menu-visual{background:linear-gradient(135deg,#e9f8f2,#f7fcfa);border:1px solid #e0f0ea}.price{color:var(--primary2)}
.add-btn{background:var(--primary);box-shadow:0 5px 12px rgba(15,159,110,.18)}
.qtybox button{background:var(--navy)}
input,select{border-color:#d7e5df;border-radius:12px}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0f9f6e18}
.btn{border-radius:11px;background:var(--navy)}.btn.green,.btn.orange{background:var(--primary)}.btn.danger{background:var(--red)}
.material-item{background:#f7fbf9;border-color:#dceae5;border-radius:14px}
.table-wrap{border-color:var(--line);border-radius:15px}.table-wrap table th{background:#f3f8f6;color:#60736c}.table-wrap table tr:last-child td{border-bottom:0}
.status-pill{background:#e7f8f0;color:#08754f}
.backup-box{background:linear-gradient(135deg,#f8fcfa,#eef9f4);border-color:#cde8dd}
.lock-screen{background:radial-gradient(circle at 50% 20%,#0c6b54 0%,#063e35 48%,#032c27 100%)}
.pin-btn{border-color:#4b8c7a;background:rgba(255,255,255,.08);backdrop-filter:blur(5px)}.pin-btn:active{background:#138b67}
@media(max-width:700px){
 header{height:64px;background:rgba(255,255,255,.96)}
 nav{height:auto;max-height:78px;background:rgba(5,62,52,.98);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.10);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}

 .shortcut-icon{width:38px;height:38px;border-radius:11px}.sync-dot{font-size:9px;padding:6px 8px}
}

async function registerPumalaPush(){

/* KASIR */
function cartQty(id){const item=cart.find(x=>x.id===id);return item?item.qty:0}
function addOne(id){const m=menus.find(x=>x.id===id);if(!m)return;const old=cart.find(x=>x.id===id);old?old.qty++:cart.push({...m,qty:1});render()}
function changeQty(id,delta){const item=cart.find(x=>x.id===id);if(!item)return;item.qty+=delta;if(item.qty<=0)cart=cart.filter(x=>x.id!==id);render()}
function setQty(id,value){const item=cart.find(x=>x.id===id);if(!item)return;let q=parseInt(value,10);if(!Number.isFinite(q)||q<1)cart=cart.filter(x=>x.id!==id);else item.qty=q;render()}
function addCustom(){
 const n=document.getElementById('customName').value.trim(),p=Number(document.getElementById('customPrice').value),q=Number(document.getElementById('customQty').value)||1;
 if(!n||p<0||q<1)return alert('Lengkapi nama, harga, dan Qty.');
 cart.push({id:'custom-'+Date.now(),name:n+' (tambahan)',price:p,qty:q});render()
}
function removeCart(i){cart.splice(i,1);render()}
function saveTransaction(){
 if(!cart.length)return alert('Pesanan masih kosong.');
 const payment=document.querySelector('input[name=paymentMethod]:checked')?.value||'cash';
 const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
 state.transactions.push({id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total,payment});
 save();cart=[];alert('Transaksi tersimpan sebagai '+(payment==='qris'?'QRIS':'Cash')+'.');render()
}

}
function addExpense(){
 const raw=document.getElementById('expenseMaterial').value,qty=Number(document.getElementById('expenseQty').value),amount=Number(document.getElementById('expenseAmount').value);
 if(!raw)return alert('Pilih bahan terlebih dahulu.');if(!(qty>0))return alert('Jumlah bahan harus diisi.');if(!(amount>0))return alert('Total harga pembelian harus diisi.');
 let name='',unit='pcs',material=null;
 if(raw==='__other__'){
   name=(document.getElementById('otherExpenseName')?.value||'').trim();
   if(!name)return alert('Masukkan nama bahan lain-lain terlebih dahulu.');
 }else{
   const idx=Number(raw);material=state.materials[idx];if(!material)return alert('Bahan tidak ditemukan.');
   name=material.name;unit=material.unit||'pcs';material.stock=(Number(material.stock)||0)+qty;material.price=amount/qty;
 }
 const id=Date.now();
 state.expenses.push({id,date:new Date().toISOString(),name,materialName:name,qty,unit,amount,other:raw==='__other__'});
 if(material)state.stockMoves.push({date:new Date().toISOString(),type:'masuk',name:material.name,qty,expenseId:id});save();render();alert('Pengeluaran tersimpan.')
}
function delExp(id){
 const e=state.expenses.find(x=>x.id==id);if(!e)return;if(!confirm('Hapus pengeluaran ini? Stok akan dikurangi kembali sesuai jumlah bahan.'))return;
 if(e.materialName&&e.qty){const m=state.materials.find(x=>x.name===e.materialName);if(m)m.stock=Math.max(0,(Number(m.stock)||0)-Number(e.qty||0));state.stockMoves=state.stockMoves.filter(x=>x.expenseId!=id)}
 state.expenses=state.expenses.filter(x=>x.id!=id);save();render()
}

/* LAPORAN */
function localDateKey(date){const d=new Date(date);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return localDateKey(new Date())}
function reportData(from,to){
 const transactions=state.transactions.filter(t=>{const d=localDateKey(t.date);return d>=from&&d<=to});
 const expenses=state.expenses.filter(e=>{const d=localDateKey(e.date);return d>=from&&d<=to});
 const income=transactions.reduce((s,t)=>s+(Number(t.total)||0),0),expense=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
 return{transactions,expenses,income,expense}
}
function reportRows(d){
 const rows=[];d.transactions.forEach(t=>rows.push({date:t.date,type:'Pemasukan',detail:(t.items||[]).map(x=>x.name+' × '+x.qty).join(', '),payment:t.payment||'cash',amount:Number(t.total)||0}));
 d.expenses.forEach(e=>rows.push({date:e.date,type:'Pengeluaran',detail:e.materialName||e.name||'-',amount:-(Number(e.amount)||0)}));
 return rows.sort((a,b)=>new Date(b.date)-new Date(a.date))
}
function reportTable(d){const rows=reportRows(d);if(!rows.length)return '<div class="empty">Tidak ada data pada periode ini.</div>';return `<div class="table-wrap"><table><tr><th>Tanggal</th><th>Jenis</th><th>Detail</th><th>Pembayaran</th><th>Nominal</th></tr>${rows.map(r=>`<tr><td>${new Date(r.date).toLocaleString('id-ID')}</td><td>${r.type}</td><td>${r.detail}</td><td>${r.type==='Pemasukan'?(r.payment==='qris'?'📱 QRIS':'💵 Cash'):'—'}</td><td><b>${rupiah(r.amount)}</b></td></tr>`).join('')}</table></div>`}
function dailySummary(from,to){
 const d=reportData(from,to),map={};d.transactions.forEach(t=>{const k=localDateKey(t.date);if(!map[k])map[k]={income:0,expense:0};map[k].income+=Number(t.total)||0});d.expenses.forEach(e=>{const k=localDateKey(e.date);if(!map[k])map[k]={income:0,expense:0};map[k].expense+=Number(e.amount)||0});
 const keys=Object.keys(map).sort().reverse();if(!keys.length)return '<div class="empty">Belum ada data harian.</div>';
 return `<div class="table-wrap"><table><tr><th>Tanggal</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo</th></tr>${keys.map(k=>`<tr><td>${new Date(k+'T00:00:00').toLocaleDateString('id-ID')}</td><td>${rupiah(map[k].income)}</td><td>${rupiah(map[k].expense)}</td><td><b>${rupiah(map[k].income-map[k].expense)}</b></td></tr>`).join('')}</table></div>`
}
function laporan(){
 const today=todayKey(),todayData=reportData(today,today),d=new Date();d.setDate(d.getDate()-6);const from7=localDateKey(d);
 document.getElementById('laporan').innerHTML=`
 <div class="section-title"><div><h2>Laporan</h2><div class="muted">Pantau pemasukan, pengeluaran, dan saldo</div></div></div>
 <div class="dashboard-grid">
  <div class="report-card green"><h3>Pemasukan Hari Ini</h3><div class="big">${rupiah(todayData.income)}</div></div>
  <div class="report-card red"><h3>Pengeluaran Hari Ini</h3><div class="big">${rupiah(todayData.expense)}</div></div>
  <div class="report-card blue"><h3>Saldo Hari Ini</h3><div class="big">${rupiah(todayData.income-todayData.expense)}</div></div>
 </div>
 <div class="card" style="margin-top:16px"><div class="section-title"><h3>Detail Hari Ini</h3><span class="muted">${today}</span></div>${reportTable(todayData)}</div>
 <div class="card"><div class="section-title"><h3>Periode Laporan</h3><span class="muted">Pilih tanggal</span></div>
  <div class="form-grid"><div><label>Dari tanggal</label><input id="reportFrom" type="date" value="${from7}"></div><div><label>Sampai tanggal</label><input id="reportTo" type="date" value="${today}"></div><div><label>&nbsp;</label><button class="btn orange" style="width:100%" onclick="showPeriodReport()">Tampilkan Laporan</button></div></div>
  <button class="btn" onclick="exportReportCSV()">Export CSV</button><div id="periodReport" style="margin-top:15px"></div>
 </div>
 <div class="card"><div class="section-title"><h3>Ringkasan Per Hari</h3><span class="muted">7 hari terakhir</span></div>${dailySummary(from7,today)}</div>`;
 showPeriodReport()
}
function showPeriodReport(){
 const from=document.getElementById('reportFrom')?.value,to=document.getElementById('reportTo')?.value;if(!from||!to)return;if(from>to)return alert('Tanggal mulai tidak boleh setelah tanggal akhir.');
 const d=reportData(from,to);
 document.getElementById('periodReport').innerHTML=`<div class="dashboard-grid"><div class="report-card green"><h3>Total Pemasukan</h3><div class="big">${rupiah(d.income)}</div></div><div class="report-card red"><h3>Total Pengeluaran</h3><div class="big">${rupiah(d.expense)}</div></div><div class="report-card blue"><h3>Saldo</h3><div class="big">${rupiah(d.income-d.expense)}</div></div></div><div style="margin-top:14px">${reportTable(d)}</div>`
}
function exportReportCSV(){
 const from=document.getElementById('reportFrom')?.value,to=document.getElementById('reportTo')?.value;if(!from||!to)return;const d=reportData(from,to),rows=[['Tanggal','Jenis','Detail','Nominal']];
 reportRows(d).forEach(x=>rows.push([new Date(x.date).toLocaleString('id-ID'),x.type,x.detail,x.amount]));
 const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PUMALA_Laporan_'+from+'_sampai_'+to+'.csv';a.click()
}

/* DELIVERY */
function delivery(){
 document.getElementById('delivery').innerHTML=`
 <div class="section-title"><div><h2>Delivery</h2><div class="muted">Hitung ongkir dan total pesanan delivery</div></div><button class="btn orange" onclick="calcDelivery()">Hitung</button></div>
 <div class="card"><div class="form-grid"><div><label>Jarak (km)</label><input id="dk" type="number" step=".1" value="1"></div><div><label>Nilai pesanan</label><input id="do" type="number" value="30000"></div><div><label>Platform</label><select id="platform"><option>GoFood</option><option>Shoppe Food</option><option>Langsung</option></select></div></div><button class="btn orange" onclick="calcDelivery()">Hitung Ongkir</button><div id="dr" style="margin-top:15px"></div><p class="muted">Tarif: 0–1 km Rp3.000; 1–2 km Rp4.000; 2–3 km Rp5.000; 3–4 km Rp7.000; 4–5 km Rp9.000. Di atas 5 km perlu negosiasi. Minimum order Rp30.000.</p></div>
 <div class="card"><div class="section-title"><h3>Status Pesanan</h3><span class="muted">Tampilan ringkas</span></div><div class="timeline"><div class="timeline-item"><span>#0001 · Pesanan delivery</span><span class="status-pill">Siap diproses</span></div><div class="timeline-item"><span>#0002 · Pesanan delivery</span><span class="status-pill">Selesai</span></div></div></div>`;
}
function calcDelivery(){
 const k=Number(document.getElementById('dk').value),o=Number(document.getElementById('do').value);if(o<30000)return document.getElementById('dr').innerHTML='<b>Minimum order Rp30.000.</b>';
 const fee=k<=1?3000:k<=2?4000:k<=3?5000:k<=4?7000:k<=5?9000:null;
 document.getElementById('dr').innerHTML=fee===null?'<b>Jarak di atas 5 km: perlu negosiasi.</b>':`<div class="total-box"><span>Ongkir ${document.getElementById('platform').value}</span><span class="total">${rupiah(fee)}</span></div><div style="margin-top:10px"><b>Total + ongkir: ${rupiah(o+fee)}</b></div>`
}

/* BACKUP */
function backup(){
 document.getElementById('backup').innerHTML=`
 <div class="section-title"><div><h2>Backup</h2><div class="muted">Simpan dan pulihkan data PUMALA dengan aman</div></div></div>
 <div class="card backup-box"><div class="backup-icon">☁️</div><h2>Backup Data</h2><p class="muted">Simpan data usaha dari perangkat ini ke file JSON. Backup dapat diimpor kembali kapan saja.</p><button class="btn orange" onclick="downloadBackup()">Backup Sekarang</button></div>
 <div class="card"><h3>Import Backup</h3><label>Pilih file JSON</label><input type="file" id="imp" accept=".json" onchange="importBackup(event)"><p class="muted">Import akan mengganti data aplikasi saat ini dengan data dari file backup.</p></div>
 <div class="card"><div class="section-title"><h3>Status Penyimpanan</h3><span class="status-pill">${cloudReady?'Tersinkron ke cloud':'Menyiapkan...'}</span></div><p class="muted">Data PUMALA menggunakan Supabase agar dapat dibuka dari perangkat lain yang menggunakan aplikasi yang sama.</p></div>`;
}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='PUMALA_Backup.json';a.click()}
async function importBackup(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{try{const x=normalizeState(JSON.parse(r.result));if(!Array.isArray(x.transactions)||!Array.isArray(x.expenses)||!Array.isArray(x.materials))throw new Error('Format tidak sesuai');
 if(confirm('Ganti data saat ini dengan data dari backup?')){state=x;saveLocal();cloudReady=true;await save();render();alert('Backup berhasil diimpor dan disimpan ke cloud.')}}catch(err){console.error(err);alert('File backup tidak valid.')}}
 r.readAsText(f)
}

window.addEventListener('error',e=>{
 const old=document.getElementById('appError');if(old)return;
 const box=document.createElement('div');box.id='appError';box.style='position:fixed;left:12px;right:12px;bottom:90px;z-index:9999;padding:14px;background:#fff3cd;color:#664d03;border:1px solid #ffecb5;border-radius:12px;font-family:Arial';
 box.innerHTML='<b>Aplikasi mengalami error.</b><br>Silakan buka ulang aplikasi. Detail: '+String(e.message||'tidak diketahui');document.body.appendChild(box)
});

nav();render();renderNotificationPanel();loadCloud();startRealtime();window.addEventListener('pointerdown',()=>{prepareOrderAudio()},{once:true});
</script>
<script>
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
