<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUMALA App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:3}
header h1{margin:0;font-size:24px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;position:sticky;top:57px;z-index:2;border-bottom:1px solid #ddd}
nav button,.btn{border:0;border-radius:9px;padding:10px 13px;background:#222;color:#fff;cursor:pointer}
nav button.active{background:#e67e22}
main{max-width:1100px;margin:auto;padding:16px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 0 10px}
label{font-size:13px;font-weight:bold}
.menu{border:1px solid #ddd;padding:14px;border-radius:10px;cursor:pointer}
.menu h3{margin:0 0 5px}
.menu:active{transform:scale(.99)}
.danger{background:#c0392b}.green{background:#168a45}.orange{background:#e67e22}
.qtybox{display:flex;align-items:center;gap:8px;margin-top:10px}
.qtybox button{width:42px;height:42px;font-size:22px;border:0;border-radius:8px;background:#222;color:#fff}
.qtybox input{width:70px;text-align:center;margin:0;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
.total{font-size:22px;font-weight:bold;text-align:right;margin:12px 0}
.muted{color:#777;font-size:13px}.stat{font-size:25px;font-weight:bold}
.material-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.material-item{padding:14px;background:#f7f7f7;border-radius:10px;font-weight:bold}

.lock-screen{
  position:fixed;inset:0;z-index:99999;
  background:linear-gradient(160deg,#111,#222);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:20px
}
.lock-panel{width:min(360px,100%);text-align:center}
.lock-title{font-size:24px;font-weight:700;margin-bottom:8px}
.lock-subtitle{color:#aaa;font-size:14px;margin-bottom:20px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 28px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff}
.pin-dot.filled{background:#fff}
.pin-error{height:20px;color:#ff8a80;font-size:13px;margin-bottom:8px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:auto}
.pin-btn{
  width:78px;height:78px;max-width:100%;justify-self:center;
  border-radius:50%;border:1px solid #555;background:#2b2b2b;color:#fff;
  font-size:28px;cursor:pointer;-webkit-tap-highlight-color:transparent
}
.pin-btn:active{background:#555;transform:scale(.96)}

</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-panel">
    <div style="font-size:46px;margin-bottom:8px">🔒</div>
    <div class="lock-title">PUMALA</div>
    <div class="lock-subtitle">Masukkan kata sandi untuk masuk</div>
    <div id="pinDots" class="pin-dots">
      <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
    </div>
    <div id="pinError" class="pin-error"></div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" onclick="pinClear()">⌫</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="pinClearAll()">C</button>
    </div>
  </div>
</div>

<header><h1>🍜 PUMALA App</h1><div class="muted" style="color:#bbb">Mie Get / Mie Nyemek</div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="page active"></section>
<section id="kasir" class="page"></section>
<section id="stok" class="page"></section>
<section id="pemasukan" class="page"></section>
<section id="pengeluaran" class="page"></section>
<section id="laporan" class="page"></section>
<section id="delivery" class="page"></section>
<section id="backup" class="page"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='pumala_main_v1';

const PUMALA_PIN='230420';
let enteredPin='';
function updatePinDots(){
  document.querySelectorAll('#pinDots .pin-dot').forEach((dot,i)=>{
    dot.classList.toggle('filled',i<enteredPin.length);
  });
}
function pinPress(n){
  if(enteredPin.length>=PUMALA_PIN.length)return;
  enteredPin+=n;
  document.getElementById('pinError').textContent='';
  updatePinDots();
  if(enteredPin.length===PUMALA_PIN.length){
    if(enteredPin===PUMALA_PIN){
      document.getElementById('lockScreen').style.display='none';
    }else{
      document.getElementById('pinError').textContent='Kata sandi salah.';
      setTimeout(()=>{enteredPin='';updatePinDots()},500);
    }
  }
}
function pinClear(){
  enteredPin=enteredPin.slice(0,-1);
  document.getElementById('pinError').textContent='';
  updatePinDots();
}
function pinClearAll(){
  enteredPin='';
  document.getElementById('pinError').textContent='';
  updatePinDots();
}


const SUPABASE_URL='https://mgtnninfuktrkasybser.supabase.co';
const SUPABASE_KEY='sb_publishable_-Ucxdn9WA_iiBklEMhICeg_ykXFifZ1';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const defaultMaterials=[
 ['Mie','porsi'],['Telor','pcs'],['Sosis','pcs'],['Bakso','pcs'],
 ['Sterofoam','pcs'],['Sedotan','pcs'],['Sendok','pcs'],
 ['Kecap','botol'],['Saos','botol'],['Sayuran','kg'],
 ['Cabai','kg'],['Minyak','liter'],['Gas','tabung'],['Air','liter']
];

function emptyState(){
 return {
  transactions:[],
  expenses:[],
  materials:defaultMaterials.map(x=>({
   name:x[0],unit:x[1],stock:0,price:0,min:0
  })),
  stockMoves:[]
 };
}

function normalizeState(x){
 x=x&&typeof x==='object'?x:{};
 if(!Array.isArray(x.transactions))x.transactions=[];
 if(!Array.isArray(x.expenses))x.expenses=[];
 if(!Array.isArray(x.materials))x.materials=[];
 if(!Array.isArray(x.stockMoves))x.stockMoves=[];
 return x;
}

function hasRealData(x){
 x=normalizeState(x);
 return x.transactions.length>0 ||
        x.expenses.length>0 ||
        x.stockMoves.length>0 ||
        x.materials.some(m =>
          Number(m.stock||0)!==0 ||
          Number(m.price||0)!==0
        );
}

let localState=JSON.parse(localStorage.getItem(KEY)||'null');
let state=normalizeState(localState||emptyState());
let cloudReady=false;
let realtimeStarted=false;
let currentPage='dashboard';

function saveLocal(){
 localStorage.setItem(KEY,JSON.stringify(state));
}

async function save(){
 saveLocal();
 if(!cloudReady)return;

 const {error}=await supabaseClient
  .from('pumala_state')
  .upsert({
   id:1,
   data:state,
   updated_at:new Date().toISOString()
  });

 if(error)console.error('Supabase save error:',error);
}

async function loadCloud(){
 const local=normalizeState(
  JSON.parse(localStorage.getItem(KEY)||'null')||state
 );

 const {data,error}=await supabaseClient
  .from('pumala_state')
  .select('id,data,updated_at')
  .eq('id',1)
  .maybeSingle();

 if(error){
  console.error('Supabase load error:',error);
  state=local;
  saveLocal();
  cloudReady=true;
  render();
  return;
 }

 const cloud=normalizeState(data&&data.data);

 /*
  * PENTING:
  * Cloud kosong tidak boleh menimpa data lokal yang sudah ada.
  */
 if(hasRealData(cloud)){
  state=cloud;
  saveLocal();
 }else if(hasRealData(local)){
  state=local;
  cloudReady=true;
  await save();
  render();
  return;
 }else{
  state=local;
  saveLocal();

  cloudReady=true;

  if(!data){
   await save();
  }

  render();
  return;
 }

 cloudReady=true;
 render();
}

function startRealtime(){
 if(realtimeStarted)return;
 realtimeStarted=true;

 supabaseClient
  .channel('pumala-sync')
  .on(
   'postgres_changes',
   {
    event:'UPDATE',
    schema:'public',
    table:'pumala_state',
    filter:'id=eq.1'
   },
   payload=>{
    const remote=normalizeState(payload.new&&payload.new.data);

    // Jangan menimpa data lokal dengan cloud kosong.
    if(!hasRealData(remote) && hasRealData(state))return;

    state=remote;
    saveLocal();
    render();
   }
  )
  .subscribe();
}

const rupiah=n=>new Intl.NumberFormat(
 'id-ID',
 {
  style:'currency',
  currency:'IDR',
  maximumFractionDigits:0
 }
).format(Number(n)||0);

const menus=[
 {id:'ori',name:'Mie Get / Nyemek Ori',price:10000},
 {id:'bs',name:'Mie Get / Nyemek + Baso / Sosis',price:12000},
 {id:'both',name:'Mie Get / Nyemek + Baso + Sosis',price:13000}
];

let cart=[];

const menuNames={
 dashboard:'Dashboard',
 kasir:'Kasir',
 stok:'Stok/Bahan',
 pemasukan:'Pemasukan',
 pengeluaran:'Pengeluaran',
 laporan:'Laporan',
 delivery:'Delivery',
 backup:'Backup'
};

function nav(){
 const items=[
  ['dashboard','Dashboard'],
  ['kasir','Kasir'],
  ['stok','Stok/Bahan'],
  ['pemasukan','Pemasukan'],
  ['pengeluaran','Pengeluaran'],
  ['laporan','Laporan'],
  ['delivery','Delivery'],
  ['backup','Backup']
 ];

 document.getElementById('nav').innerHTML=
  items.map(x=>`
   <button
    class="${currentPage===x[0]?'active':''}"
    onclick="show('${x[0]}')">
    ${x[1]}
   </button>
  `).join('');
}

function show(id){
 currentPage=id;

 document.querySelectorAll('.page')
  .forEach(x=>x.classList.remove('active'));

 document.getElementById(id)
  .classList.add('active');

 nav();
 render();
}

function render(){
 dashboard();
 kasir();
 stok();
 pemasukan();
 pengeluaran();
 laporan();
 delivery();
 backup();

 document.querySelectorAll('.page')
  .forEach(x=>x.classList.remove('active'));

 document.getElementById(currentPage)
  .classList.add('active');

 nav();
}

/* ================= DASHBOARD ================= */

function dashboard(){
 const income=state.transactions.reduce(
  (s,t)=>s+(Number(t.total)||0),0
 );

 const exp=state.expenses.reduce(
  (s,e)=>s+(Number(e.amount)||0),0
 );

 document.getElementById('dashboard').innerHTML=`
 <div class="card">
  <h2>Dashboard</h2>

  <div class="grid">
   <div class="card">
    <div class="muted">Total Pemasukan</div>
    <div class="stat">${rupiah(income)}</div>
   </div>

   <div class="card">
    <div class="muted">Total Pengeluaran</div>
    <div class="stat">${rupiah(exp)}</div>
   </div>

   <div class="card">
    <div class="muted">Saldo Sementara</div>
    <div class="stat">${rupiah(income-exp)}</div>
   </div>

   <div class="card">
    <div class="muted">Transaksi</div>
    <div class="stat">${state.transactions.length}</div>
   </div>
  </div>
 </div>
 `;
}

/* ================= KASIR ================= */

function cartQty(id){
 const item=cart.find(x=>x.id===id);
 return item?item.qty:0;
}

function addOne(id){
 const m=menus.find(x=>x.id===id);
 if(!m)return;

 const old=cart.find(x=>x.id===id);

 if(old){
  old.qty++;
 }else{
  cart.push({...m,qty:1});
 }

 render();
}

function changeQty(id,delta){
 const item=cart.find(x=>x.id===id);
 if(!item)return;

 item.qty+=delta;

 if(item.qty<=0){
  cart=cart.filter(x=>x.id!==id);
 }

 render();
}

function setQty(id,value){
 const item=cart.find(x=>x.id===id);
 if(!item)return;

 let q=parseInt(value,10);

 if(!Number.isFinite(q)||q<1){
  cart=cart.filter(x=>x.id!==id);
 }else{
  item.qty=q;
 }

 render();
}

function addCustom(){
 const n=document.getElementById('customName').value.trim();
 const p=Number(document.getElementById('customPrice').value);
 const q=Number(document.getElementById('customQty').value)||1;

 if(!n||p<0||q<1){
  return alert('Lengkapi nama, harga, dan Qty.');
 }

 cart.push({
  id:'custom-'+Date.now(),
  name:n+' (tambahan)',
  price:p,
  qty:q
 });

 render();
}

function removeCart(i){
 cart.splice(i,1);
 render();
}

function saveTransaction(){
 if(!cart.length){
  return alert('Pesanan masih kosong.');
 }

 const total=cart.reduce(
  (s,x)=>s+x.price*x.qty,0
 );

 state.transactions.push({
  id:Date.now(),
  date:new Date().toISOString(),
  items:cart.map(x=>({...x})),
  total
 });

 save();

 cart=[];

 alert('Transaksi tersimpan.');
 render();
}

function kasir(){
 document.getElementById('kasir').innerHTML=`
 <div class="card">
  <h2>Kasir</h2>

  <p class="muted">
   Klik menu sekali untuk memasukkan 1 pcs.
   Gunakan + / − untuk mengubah jumlah.
  </p>

  <div class="grid">

   ${menus.map(m=>{
    const q=cartQty(m.id);

    return `
    <div
     class="menu"
     onclick="addOne('${m.id}')">

     <h3>${m.name}</h3>
     <b>${rupiah(m.price)}</b>

     ${
      q>0
      ? `
       <div
        class="qtybox"
        onclick="event.stopPropagation()">

        <button onclick="changeQty('${m.id}',-1)">
         −
        </button>

        <input
         type="number"
         min="1"
         value="${q}"
         onclick="event.stopPropagation()"
         onchange="setQty('${m.id}',this.value)">

        <button onclick="changeQty('${m.id}',1)">
         +
        </button>
       </div>
      `
      : `
       <div class="muted" style="margin-top:10px">
        Tap untuk tambah 1 pcs
       </div>
      `
     }

    </div>
    `;
   }).join('')}

  </div>
 </div>

 <div class="card">
  <h3>Pesanan Tambahan / Manual</h3>

  <div class="grid">
   <div>
    <label>Nama item</label>
    <input
     id="customName"
     placeholder="Contoh: Es Teh">
   </div>

   <div>
    <label>Harga</label>
    <input
     id="customPrice"
     type="number"
     placeholder="3000">
   </div>

   <div>
    <label>Qty</label>
    <input
     id="customQty"
     type="number"
     min="1"
     value="1">
   </div>
  </div>

  <button
   class="btn"
   onclick="addCustom()">
   Tambah Manual
  </button>
 </div>

 <div class="card">
  <h3>Pesanan Saat Ini</h3>

  ${
   cart.length
   ?
   cart.map((x,i)=>`
    <div
     style="padding:10px 0;border-bottom:1px solid #ddd">

     <b>${x.name}</b>
     × ${x.qty}

     — <b>${rupiah(x.price*x.qty)}</b>

     <button
      class="btn danger"
      onclick="removeCart(${i})">
      Hapus
     </button>
    </div>
   `).join('')
   :
   '<div class="muted">Belum ada pesanan.</div>'
  }

  <div class="total">
   Total:
   ${rupiah(
    cart.reduce(
     (s,x)=>s+x.price*x.qty,0
    )
   )}
  </div>

  <button
   class="btn green"
   onclick="saveTransaction()">
   Simpan Transaksi
  </button>

  <button
   class="btn danger"
   onclick="cart=[];render()">
   Kosongkan
  </button>
 </div>
 `;
}

/* ================= STOK / BAHAN ================= */

function stok(){
 document.getElementById('stok').innerHTML=`
 <div class="card">
  <h2>Stok / Bahan</h2>

  <p class="muted">
   Di sini hanya ditampilkan nama bahan.
   Data stok tetap disimpan di belakang layar untuk
   kebutuhan pengeluaran.
  </p>

  <div class="material-list">

   ${
    state.materials.length
    ?
    state.materials.map(m=>`
     <div class="material-item">
      ${m.name}
     </div>
    `).join('')
    :
    '<div class="muted">Belum ada bahan.</div>'
   }

  </div>
 </div>

 <div class="card">
  <h3>＋ Tambah Bahan</h3>

  <label>Nama bahan</label>

  <input
   id="mn"
   placeholder="Contoh: Keju">

  <button
   class="btn green"
   onclick="addMaterial()">
   Tambah Bahan
  </button>

function addMaterial(){
 const input=document.getElementById('mn');
 const n=input.value.trim();

 if(!n){
  return alert('Nama bahan wajib diisi.');
 }

 if(state.materials.some(
  m=>m.name.toLowerCase()===n.toLowerCase()
 )){
  return alert('Bahan tersebut sudah ada.');
 }

 state.materials.push({
  name:n,
  unit:'pcs',
  stock:0,
  price:0,
  min:0
 });

 save();
 render();
}

function delMaterial(i){
 if(confirm('Hapus bahan ini?')){
  state.materials.splice(i,1);
  save();
  render();
 }
}

/* ================= PEMASUKAN ================= */

function pemasukan(){
 document.getElementById('pemasukan').innerHTML=`
 <div class="card">
  <h2>Pemasukan</h2>

  ${
   state.transactions.length
   ?
   `
   <table>
    <tr>
     <th>Tanggal</th>
     <th>Detail</th>
     <th>Total</th>
     <th>Aksi</th>
    </tr>

    ${

      <tr>
       <td>
        ${new Date(t.date).toLocaleString('id-ID')}
       </td>

       <td>

       </td>

       <td>
        ${rupiah(t.total)}
       </td>

       <td>
        <button
         class="btn danger"
         onclick="delTx(${t.id})">
         Hapus
        </button>
       </td>
      </tr>
     `).join('')
    }
   </table>
   `
   :
   '<p class="muted">Belum ada transaksi.</p>'
  }
 </div>
 `;

function delTx(id){
 if(confirm('Hapus transaksi?')){
  state.transactions=
   state.transactions.filter(t=>t.id!=id);

  save();
  render();
 }
}

/* ================= PENGELUARAN ================= */

   </option>

  </p>

    <label>Bahan</label>

      options ||

     <th>Aksi</th>

    ${

      <tr>
       <td>${new Date(e.date).toLocaleString('id-ID')}</td>
       <td>${e.materialName||e.name||'-'}</td>
       <td>${e.qty??'-'} ${e.unit||''}</td>
       <td>${rupiah(e.amount)}</td>
       <td>
        <button
         class="btn danger"
         onclick="delExp(${e.id})">
         Hapus
        </button>
       </td>
      </tr>
     `).join('')
    }
   </table>
   `
   :
   '<p class="muted">Belum ada pengeluaran.</p>'
  }
 </div>
 `;
}

function addExpense(){
 const idx=Number(
  document.getElementById('expenseMaterial').value
 );

 const qty=Number(
  document.getElementById('expenseQty').value
 );

 const amount=Number(
  document.getElementById('expenseAmount').value
 );

 if(!state.materials[idx]){
  return alert('Pilih bahan terlebih dahulu.');
 }

 if(!(qty>0)){
  return alert('Jumlah bahan harus diisi.');
 }

 if(!(amount>0)){
  return alert('Total harga pembelian harus diisi.');
 }

 const material=state.materials[idx];

 material.stock=
  (Number(material.stock)||0)+qty;

 material.price=amount/qty;

 const id=Date.now();

 state.expenses.push({
  id:id,
  date:new Date().toISOString(),
  name:material.name,
  materialName:material.name,
  qty:qty,
  unit:material.unit||'pcs',
  amount:amount
 });

 state.stockMoves.push({
  date:new Date().toISOString(),
  type:'masuk',
  name:material.name,
  qty:qty,
  expenseId:id
 });

 save();
 render();

 alert(
  'Pengeluaran tersimpan dan stok '+
  material.name+
  ' bertambah '+qty+
  ' '+(material.unit||'pcs')+'.'
 );
}

function delExp(id){
 const e=state.expenses.find(x=>x.id==id);

 if(!e)return;

 if(!confirm(
  'Hapus pengeluaran ini? Stok akan dikurangi kembali sesuai jumlah bahan.'
 ))return;

 if(e.materialName&&e.qty){
  const m=state.materials.find(
   x=>x.name===e.materialName
  );

  if(m){
   m.stock=Math.max(
    0,
    (Number(m.stock)||0)-Number(e.qty||0)
   );
  }

  state.stockMoves=
   state.stockMoves.filter(x=>x.expenseId!=id);
 }

 state.expenses=
  state.expenses.filter(x=>x.id!=id);

 save();
 render();
}

/* ================= LAPORAN ================= */

function localDateKey(date){
 const d=new Date(date);

 if(isNaN(d))return '';

 return d.getFullYear()+
  '-'+String(d.getMonth()+1).padStart(2,'0')+
  '-'+String(d.getDate()).padStart(2,'0');
}

function todayKey(){
 return localDateKey(new Date());
}

function reportData(from,to){
 const transactions=
  state.transactions.filter(t=>{
   const d=localDateKey(t.date);
   return d>=from&&d<=to;
  });

 const expenses=
  state.expenses.filter(e=>{
   const d=localDateKey(e.date);
   return d>=from&&d<=to;
  });

 const income=transactions.reduce(
  (s,t)=>s+(Number(t.total)||0),0
 );

 const expense=expenses.reduce(
  (s,e)=>s+(Number(e.amount)||0),0
 );

 return {
  transactions,
  expenses,
  income,
  expense
 };
}

function reportRows(d){
 const rows=[];

 d.transactions.forEach(t=>{
  rows.push({
   date:t.date,
   type:'Pemasukan',
   detail:(t.items||[])
    .map(x=>x.name+' × '+x.qty)
    .join(', '),
   amount:Number(t.total)||0
  });
 });

 d.expenses.forEach(e=>{
  rows.push({
   date:e.date,
   type:'Pengeluaran',
   detail:e.materialName||e.name||'-',
   amount:-(Number(e.amount)||0)
  });
 });

 return rows.sort(
  (a,b)=>new Date(b.date)-new Date(a.date)
 );
}

function reportTable(d){
 const rows=reportRows(d);

 if(!rows.length){
  return '<p class="muted">Tidak ada data pada periode ini.</p>';
 }

 return `
 <table>
  <tr>
   <th>Tanggal</th>
   <th>Jenis</th>
   <th>Detail</th>
   <th>Nominal</th>
  </tr>

  ${rows.map(r=>`
   <tr>
    <td>${new Date(r.date).toLocaleString('id-ID')}</td>
    <td>${r.type}</td>
    <td>${r.detail}</td>
    <td>${rupiah(r.amount)}</td>
   </tr>
  `).join('')}
 </table>
 `;
}

function dailySummary(from,to){
 const d=reportData(from,to);
 const map={};

 d.transactions.forEach(t=>{
  const k=localDateKey(t.date);
  if(!map[k])map[k]={income:0,expense:0};
  map[k].income+=Number(t.total)||0;
 });

 d.expenses.forEach(e=>{
  const k=localDateKey(e.date);
  if(!map[k])map[k]={income:0,expense:0};
  map[k].expense+=Number(e.amount)||0;
 });

 const keys=Object.keys(map).sort().reverse();

 if(!keys.length){
  return '<p class="muted">Belum ada data harian.</p>';
 }

 return `
 <table>
  <tr>
   <th>Tanggal</th>
   <th>Pemasukan</th>
   <th>Pengeluaran</th>
   <th>Saldo</th>
  </tr>

  ${keys.map(k=>`
   <tr>
    <td>
     ${new Date(k+'T00:00:00')
      .toLocaleDateString('id-ID')}
    </td>

    <td>${rupiah(map[k].income)}</td>
    <td>${rupiah(map[k].expense)}</td>
    <td>
     ${rupiah(
      map[k].income-map[k].expense
     )}
    </td>
   </tr>
  `).join('')}
 </table>
 `;
}

function exportReportCSV(){
 const from=document.getElementById('reportFrom')?.value;
 const to=document.getElementById('reportTo')?.value;

 if(!from||!to)return;

 const d=reportData(from,to);

 const rows=[
  ['Tanggal','Jenis','Detail','Nominal']
 ];

 reportRows(d).forEach(x=>{
  rows.push([
   new Date(x.date).toLocaleString('id-ID'),
   x.type,
   x.detail,
   x.amount
  ]);
 });

 const csv=rows.map(r=>
  r.map(v=>
   `"${String(v).replaceAll('"','""')}"`
  ).join(',')
 ).join('\n');

 const a=document.createElement('a');

 a.href=URL.createObjectURL(
  new Blob([csv],{type:'text/csv'})
 );

 a.download=
  'PUMALA_Laporan_'+from+'_sampai_'+to+'.csv';

 a.click();
}

function calcDelivery(){
 const k=Number(
  document.getElementById('dk').value
 );

 const o=Number(
  document.getElementById('do').value
 );

 if(o<30000){
  return document.getElementById('dr').innerHTML=
   '<b>Minimum order Rp30.000.</b>';
 }

 const fee=
  k<=1?3000:
  k<=2?4000:
  k<=3?5000:
  k<=4?7000:
  k<=5?9000:null;

 document.getElementById('dr').innerHTML=
  fee===null
  ?
  '<b>Jarak di atas 5 km: perlu negosiasi.</b>'
  :
  `<b>Ongkir: ${rupiah(fee)}</b>
   <br>Total + ongkir: ${rupiah(o+fee)}`;
}

   onchange="importBackup(event)">

   dengan data dari file backup.
  </p>

function downloadBackup(){
 const a=document.createElement('a');

 a.href=URL.createObjectURL(
  new Blob(
   [JSON.stringify(state,null,2)],
   {type:'application/json'}
  )
 );

 a.download='PUMALA_Backup.json';
 a.click();
}

async function importBackup(e){
 const f=e.target.files[0];

 if(!f)return;

 const r=new FileReader();

 r.onload=async()=>{
  try{
   const x=normalizeState(
    JSON.parse(r.result)
   );

   if(
    !Array.isArray(x.transactions)||
    !Array.isArray(x.expenses)||
    !Array.isArray(x.materials)
   ){
    throw new Error('Format tidak sesuai');
   }

   if(confirm(
    'Ganti data saat ini dengan data dari backup?'
   )){
    state=x;

    saveLocal();

    // Setelah import, cloud boleh ditulis.
    cloudReady=true;

    await save();

    render();

    alert(
     'Backup berhasil diimpor dan disimpan ke cloud.'
    );
   }

  }catch(err){
   console.error(err);
   alert('File backup tidak valid.');
  }
 };

 r.readAsText(f);
}
