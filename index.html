<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUMALA App</title>
<style>
*{box-sizing:border-box}
:root{
 --primary:#1677ff;--primary2:#075ed8;--navy:#09264d;--navy2:#0e3567;
 --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#7b8799;--line:#e6ebf2;
 --green:#12a866;--red:#ef4d5c;--orange:#f59e0b;--purple:#7c4dff;--cyan:#0ea5b7;
 --shadow:0 8px 28px rgba(20,48,84,.07)
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
body{min-height:100vh}
header{
 height:72px;background:#fff;border-bottom:1px solid var(--line);position:fixed;left:230px;right:0;top:0;z-index:30;
 display:flex;align-items:center;padding:0 28px
}
.header-inner{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.brand{display:none}.brand-icon{font-size:28px}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}
.sync-dot{font-size:12px;color:#6b7789;white-space:nowrap;background:#f5f8fc;padding:8px 12px;border-radius:999px}
nav{
 position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,#09264d,#071d3b);
 color:#fff;z-index:40;padding:18px 12px;display:flex;flex-direction:column;gap:5px;overflow-y:auto
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 24px}
.sidebar-brand .logo{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:22px}
.sidebar-brand b{font-size:19px}.sidebar-brand span{display:block;color:#a9bdd8;font-size:10px;margin-top:2px}
nav button{
 border:0;background:transparent;color:#d7e3f3;padding:12px 13px;border-radius:11px;text-align:left;font-weight:600;
 display:flex;align-items:center;gap:10px;font-size:13px;width:100%
}
nav button:hover{background:rgba(255,255,255,.08)}nav button.active{background:#1677ff;color:#fff;box-shadow:0 5px 14px rgba(22,119,255,.25)}
.nav-spacer{flex:1}
.nav-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:8px}
main{margin-left:230px;padding:96px 28px 35px;max-width:1450px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#fff,#f5f9ff);border-color:#dfeafa;padding:24px}
.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.section-title h2,.section-title h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat-card{padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 3px 12px rgba(20,48,84,.03)}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat{font-size:23px;font-weight:850}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.report-card{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff;box-shadow:var(--shadow)}
.report-card h3{margin:0 0 5px;font-size:15px}.report-card .big{font-size:24px;font-weight:850;margin-top:8px}.report-card .mini{font-size:12px;color:var(--muted)}
.report-card.green{border-top:4px solid var(--green)}.report-card.red{border-top:4px solid var(--red)}.report-card.blue{border-top:4px solid var(--primary)}.report-card.purple{border-top:4px solid var(--purple)}
.total-box{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border-radius:14px;background:#f4f8ff;border:1px solid #e0eaff;margin-top:14px}
.total{font-size:23px;font-weight:850;color:var(--primary2)}
.shortcut-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.shortcut{
 border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;min-height:108px;
 box-shadow:0 4px 13px rgba(20,48,84,.04);transition:.15s
}
.shortcut:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,48,84,.08)}
.shortcut:active{transform:scale(.98)}.shortcut-icon{font-size:25px}.shortcut h3{margin:8px 0 3px;font-size:14px}.shortcut p{margin:0;color:var(--muted);font-size:11px;line-height:1.35}
.menu-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1}
.category-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.category-row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:12px;font-weight:700}.category-row button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.pos-products{min-width:0}.cart-panel{position:sticky;top:88px;height:max-content}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.menu{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;box-shadow:0 4px 14px rgba(20,48,84,.05);overflow:hidden}
.menu-visual{height:108px;border-radius:13px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,#eaf3ff,#f8fbff);margin-bottom:11px}
.menu h3{margin:0 0 5px;font-size:14px;line-height:1.3}.price{font-weight:850;font-size:15px;color:var(--primary2)}
.menu-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.add-btn{width:34px;height:34px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:20px;font-weight:800}
.qtybox{display:flex;align-items:center;gap:7px;margin-top:10px}.qtybox button{width:34px;height:34px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:19px}.qtybox input{width:54px;text-align:center;padding:8px}
.cart-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.cart-item:last-child{border-bottom:0}
input,select{width:100%;padding:11px 12px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1677ff18}
label{display:block;font-size:11px;font-weight:750;margin:2px 0 5px;color:#526071}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:750;margin:3px 3px 3px 0}.btn.green{background:var(--green)}.btn.orange{background:var(--primary)}.btn.danger{background:var(--red)}
.material-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.material-item{padding:15px;background:#f8fafc;border:1px solid var(--line);border-radius:13px;font-weight:750;display:flex;justify-content:space-between}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{font-size:11px;color:#657185;background:#f8fafc}
.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timeline{display:grid;gap:10px}.timeline-item{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.status-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf7f0;color:#08783f;font-size:10px;font-weight:800}
.backup-box{text-align:center;padding:28px;border:2px dashed #cfdbea;border-radius:18px;background:#f9fbff}.backup-icon{font-size:48px}

/* lock screen */
.lock-screen{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#071d3b,#123f75);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-panel{width:min(360px,100%);text-align:center}.lock-title{font-size:25px;font-weight:800}.lock-subtitle{color:#b9cbe2;font-size:14px;margin:6px 0 18px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 25px}.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff}.pin-dot.filled{background:#fff}
.pin-error{height:20px;color:#ff9ea8;font-size:13px;margin-bottom:8px}.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:auto}.pin-btn{width:78px;height:78px;max-width:100%;justify-self:center;border-radius:50%;border:1px solid #52719a;background:#173c69;color:#fff;font-size:28px}.pin-btn:active{background:#2b5b8e;transform:scale(.96)}

@media(max-width:1050px){
 .shortcut-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos-layout{grid-template-columns:1fr}.cart-panel{position:static}.dashboard-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
 header{position:sticky;left:0;right:0;height:62px;padding:0 14px;top:0}.header-inner{justify-content:flex-end}
 nav{left:0;right:0;top:auto;bottom:0;width:auto;height:auto;max-height:76px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:row;gap:2px;border-top:1px solid #dbe2ec}
 .sidebar-brand,.nav-spacer,.nav-bottom{display:none}nav button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:7px 4px;font-size:9px;min-width:0;flex:1;text-align:center}nav button span{display:block}
 main{margin-left:0;padding:14px 10px 92px}.card{padding:15px;border-radius:15px}.hero{padding:19px}.hero h2{font-size:21px}
 .shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.shortcut{min-height:100px;padding:12px}
 .grid,.form-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 1fr;gap:9px}.menu{padding:9px}.menu-visual{height:92px;font-size:42px}.menu h3{font-size:13px}.price{font-size:14px}
 .material-list{grid-template-columns:1fr 1fr}.menu-toolbar{align-items:stretch;flex-direction:column}.sync-dot{font-size:10px;padding:7px 9px}
 .pos-layout{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
 <div class="lock-panel">
  <div style="font-size:46px;margin-bottom:8px">🔒</div>
  <div class="lock-title">PUMALA</div>
  <div class="lock-subtitle">Masukkan kata sandi untuk masuk</div>
  <div id="pinDots" class="pin-dots">
   <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
   <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
  </div>
  <div id="pinError" class="pin-error"></div>
  <div class="pin-grid">
   <button class="pin-btn" onclick="pinPress('1')">1</button><button class="pin-btn" onclick="pinPress('2')">2</button><button class="pin-btn" onclick="pinPress('3')">3</button>
   <button class="pin-btn" onclick="pinPress('4')">4</button><button class="pin-btn" onclick="pinPress('5')">5</button><button class="pin-btn" onclick="pinPress('6')">6</button>
   <button class="pin-btn" onclick="pinPress('7')">7</button><button class="pin-btn" onclick="pinPress('8')">8</button><button class="pin-btn" onclick="pinPress('9')">9</button>
   <button class="pin-btn" onclick="pinClear()">⌫</button><button class="pin-btn" onclick="pinPress('0')">0</button><button class="pin-btn" onclick="pinClearAll()">C</button>
  </div>
 </div>
</div>

<header>
 <div class="header-inner">
  <div class="sync-dot" id="syncStatus">● Menyiapkan...</div>
 </div>
</header>
<nav id="nav"></nav>

<main>
 <section id="dashboard" class="page active"></section>
 <section id="kasir" class="page"></section>
 <section id="stok" class="page"></section>
 <section id="pemasukan" class="page"></section>
 <section id="pengeluaran" class="page"></section>
 <section id="laporan" class="page"></section>
 <section id="delivery" class="page"></section>
 <section id="backup" class="page"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='pumala_main_v1';
const PUMALA_PIN='230420';
let enteredPin='';
function updatePinDots(){document.querySelectorAll('#pinDots .pin-dot').forEach((d,i)=>d.classList.toggle('filled',i<enteredPin.length))}
function pinPress(n){
 if(enteredPin.length>=PUMALA_PIN.length)return;
 enteredPin+=n;document.getElementById('pinError').textContent='';updatePinDots();
 if(enteredPin.length===PUMALA_PIN.length){
  if(enteredPin===PUMALA_PIN)document.getElementById('lockScreen').style.display='none';
  else{document.getElementById('pinError').textContent='Kata sandi salah.';setTimeout(()=>{enteredPin='';updatePinDots()},500)}
 }
}
function pinClear(){enteredPin=enteredPin.slice(0,-1);document.getElementById('pinError').textContent='';updatePinDots()}
function pinClearAll(){enteredPin='';document.getElementById('pinError').textContent='';updatePinDots()}

const SUPABASE_URL='https://mgtnninfuktrkasybser.supabase.co';
const SUPABASE_KEY='sb_publishable_-Ucxdn9WA_iiBklEMhICeg_ykXFifZ1';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defaultMaterials=[['Mie','porsi'],['Telor','pcs'],['Sosis','pcs'],['Bakso','pcs'],['Sterofoam','pcs'],['Sedotan','pcs'],['Sendok','pcs'],['Kecap','botol'],['Saos','botol'],['Sayuran','kg'],['Cabai','kg'],['Minyak','liter'],['Gas','tabung'],['Air','liter']];
function emptyState(){return{transactions:[],expenses:[],materials:defaultMaterials.map(x=>({name:x[0],unit:x[1],stock:0,price:0,min:0})),stockMoves:[]}}
function normalizeState(x){x=x&&typeof x==='object'?x:{};if(!Array.isArray(x.transactions))x.transactions=[];if(!Array.isArray(x.expenses))x.expenses=[];if(!Array.isArray(x.materials))x.materials=[];if(!Array.isArray(x.stockMoves))x.stockMoves=[];return x}
function hasRealData(x){x=normalizeState(x);return x.transactions.length>0||x.expenses.length>0||x.stockMoves.length>0||x.materials.some(m=>Number(m.stock||0)!==0||Number(m.price||0)!==0)}
let localState=JSON.parse(localStorage.getItem(KEY)||'null');
let state=normalizeState(localState||emptyState()),cloudReady=false,realtimeStarted=false,currentPage='dashboard';
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
async function save(){
 saveLocal();if(!cloudReady)return;
 const {error}=await supabaseClient.from('pumala_state').upsert({id:1,data:state,updated_at:new Date().toISOString()});
 if(error)console.error('Supabase save error:',error);
}
async function loadCloud(){
 const local=normalizeState(JSON.parse(localStorage.getItem(KEY)||'null')||state);
 const {data,error}=await supabaseClient.from('pumala_state').select('id,data,updated_at').eq('id',1).maybeSingle();
 if(error){console.error(error);state=local;saveLocal();cloudReady=true;setSync('● Offline / lokal');render();return}
 const cloud=normalizeState(data&&data.data);
 if(hasRealData(cloud)){state=cloud;saveLocal()}
 else if(hasRealData(local)){state=local;cloudReady=true;await save();setSync('● Tersinkron');render();return}
 else{state=local;saveLocal();cloudReady=true;if(!data)await save();setSync('● Tersinkron');render();return}
 cloudReady=true;setSync('● Tersinkron');render();
}
function startRealtime(){
 if(realtimeStarted)return;realtimeStarted=true;
 supabaseClient.channel('pumala-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'pumala_state',filter:'id=eq.1'},payload=>{
  const remote=normalizeState(payload.new&&payload.new.data);
  if(!hasRealData(remote)&&hasRealData(state))return;
  state=remote;saveLocal();render();
 }).subscribe();
}
function setSync(t){const e=document.getElementById('syncStatus');if(e)e.textContent=t}
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const menus=[
 {id:'ori',name:'Mie Get / Nyemek Ori',price:10000},
 {id:'bs',name:'Mie Get / Nyemek + Baso / Sosis',price:12000},
 {id:'both',name:'Mie Get / Nyemek + Baso + Sosis',price:13000}
];
let cart=[];
const menuNames={dashboard:'Dashboard',kasir:'Kasir',stok:'Stok/Bahan',pemasukan:'Pemasukan',pengeluaran:'Pengeluaran',laporan:'Laporan',delivery:'Delivery',backup:'Backup'};
const navItems=[['dashboard','🏠','Dashboard'],['kasir','🛒','Kasir'],['stok','📦','Stok'],['pemasukan','💰','Pemasukan'],['pengeluaran','💸','Pengeluaran'],['laporan','📊','Laporan'],['delivery','🛵','Delivery'],['backup','💾','Backup']];
function nav(){
 const items=navItems.map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="show('${x[0]}')"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('');
 document.getElementById('nav').innerHTML=`<div class="sidebar-brand"><div class="logo">🍜</div><div><b>PUMALA</b><span>Kelola usaha, lebih mudah</span></div></div>${items}<div class="nav-spacer"></div><div class="nav-bottom"><button onclick="alert('Pengaturan PIN dan akun dapat ditambahkan di versi berikutnya.')"><span>⚙️</span><span>Pengaturan</span></button></div>`;
}
function show(id){currentPage=id;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');nav();render()}
function render(){
 dashboard();kasir();stok();pemasukan();pengeluaran();laporan();delivery();backup();
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(currentPage).classList.add('active');nav();
}

/* DASHBOARD */
function dashboard(){
 const now=new Date();
 const today=todayKey();

 const currentMonthStart=new Date(now.getFullYear(),now.getMonth(),1);
 const currentMonthKey=localDateKey(currentMonthStart);
 const currentMonthEnd=localDateKey(new Date(now.getFullYear(),now.getMonth()+1,0));

 const previousMonthStart=new Date(now.getFullYear(),now.getMonth()-1,1);
 const previousMonthEnd=localDateKey(new Date(now.getFullYear(),now.getMonth(),0));

 const daily=reportData(today,today);
 const previousMonth=reportData(localDateKey(previousMonthStart),previousMonthEnd);
 const currentMonth=reportData(currentMonthKey,currentMonthEnd);

 const previousBalance=previousMonth.income-previousMonth.expense;
 const runningBalance=previousBalance+currentMonth.income-currentMonth.expense;

 const monthName=d=>d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
 const dailyDate=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

 document.getElementById('dashboard').innerHTML=`
  <div class="card hero">
   <h2>Selamat datang CEO Mie Get/Nyemek PUMALA 👋</h2>
  </div>

  <div class="card">
   <div class="section-title"><h3>⚡ Pintasan</h3><span class="muted">Buka menu dengan cepat</span></div>
   <div class="shortcut-grid">
    <button class="shortcut" onclick="show('kasir')"><div class="shortcut-icon">🛒</div><h3>Kasir</h3><p>Catat pesanan dan transaksi</p></button>
    <button class="shortcut" onclick="show('stok')"><div class="shortcut-icon">📦</div><h3>Stok / Bahan</h3><p>Lihat dan tambah bahan</p></button>
    <button class="shortcut" onclick="show('pemasukan')"><div class="shortcut-icon">💰</div><h3>Pemasukan</h3><p>Lihat riwayat penjualan</p></button>
    <button class="shortcut" onclick="show('pengeluaran')"><div class="shortcut-icon">💸</div><h3>Pengeluaran</h3><p>Catat pembelian bahan</p></button>
    <button class="shortcut" onclick="show('laporan')"><div class="shortcut-icon">📊</div><h3>Laporan</h3><p>Laporan harian dan periode</p></button>
    <button class="shortcut" onclick="show('delivery')"><div class="shortcut-icon">🛵</div><h3>Delivery</h3><p>Kelola pesanan delivery</p></button>
    <button class="shortcut" onclick="show('backup')"><div class="shortcut-icon">💾</div><h3>Backup</h3><p>Simpan atau impor data</p></button>
   </div>
  </div>

  <div class="section-title"><h3>📅 Laporan Harian</h3><span class="muted">${dailyDate}</span></div>
  <div class="grid">
   <div class="stat-card"><div class="stat-label">Pemasukan Hari Ini</div><div class="stat">${rupiah(daily.income)}</div></div>
   <div class="stat-card"><div class="stat-label">Pengeluaran Hari Ini</div><div class="stat">${rupiah(daily.expense)}</div></div>
   <div class="stat-card"><div class="stat-label">Saldo Hari Ini</div><div class="stat">${rupiah(daily.income-daily.expense)}</div></div>
  </div>

  <div class="section-title" style="margin-top:18px"><h3>🗓️ Laporan Bulanan</h3><span class="muted">${monthName(previousMonthStart)}</span></div>
  <div class="card">
   <div class="grid">
    <div><div class="muted">Pemasukan</div><b>${rupiah(previousMonth.income)}</b></div>
    <div><div class="muted">Pengeluaran</div><b>${rupiah(previousMonth.expense)}</b></div>
    <div><div class="muted">Saldo</div><b>${rupiah(previousBalance)}</b></div>
   </div>
  </div>

  <div class="section-title" style="margin-top:18px"><h3>📈 Laporan Bulanan Sedang Berjalan</h3><span class="muted">${monthName(now)}</span></div>
  <div class="card">
   <div class="grid">
    <div><div class="muted">Saldo Bulan Kemarin</div><b>${rupiah(previousBalance)}</b></div>
    <div><div class="muted">＋ Pemasukan Bulan Ini</div><b>${rupiah(currentMonth.income)}</b></div>
    <div><div class="muted">− Pengeluaran Bulan Ini</div><b>${rupiah(currentMonth.expense)}</b></div>
   </div>

    <span>Saldo Berjalan</span>

/* KASIR */
function cartQty(id){const item=cart.find(x=>x.id===id);return item?item.qty:0}
function addOne(id){const m=menus.find(x=>x.id===id);if(!m)return;const old=cart.find(x=>x.id===id);old?old.qty++:cart.push({...m,qty:1});render()}
function changeQty(id,delta){const item=cart.find(x=>x.id===id);if(!item)return;item.qty+=delta;if(item.qty<=0)cart=cart.filter(x=>x.id!==id);render()}
function setQty(id,value){const item=cart.find(x=>x.id===id);if(!item)return;let q=parseInt(value,10);if(!Number.isFinite(q)||q<1)cart=cart.filter(x=>x.id!==id);else item.qty=q;render()}
function addCustom(){
 const n=document.getElementById('customName').value.trim(),p=Number(document.getElementById('customPrice').value),q=Number(document.getElementById('customQty').value)||1;
 if(!n||p<0||q<1)return alert('Lengkapi nama, harga, dan Qty.');
 cart.push({id:'custom-'+Date.now(),name:n+' (tambahan)',price:p,qty:q});render()
}
function removeCart(i){cart.splice(i,1);render()}
function saveTransaction(){
 if(!cart.length)return alert('Pesanan masih kosong.');
 const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
 state.transactions.push({id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total});
 save();cart=[];alert('Transaksi tersimpan.');render()
}
function kasir(){
 const icons={ori:'🍜',bs:'🍜',both:'🍜'};
 document.getElementById('kasir').innerHTML=`
 <div class="section-title"><div><h2>Kasir</h2><div class="muted">Pilih menu untuk menambahkan pesanan</div></div></div>
 <div class="menu-toolbar"><input class="search" placeholder="🔎 Cari menu atau bahan..." oninput="filterKasir(this.value)"></div>
 <div class="category-row"><button class="active">Semua</button><button>Makanan</button><button>Minuman</button><button>Snack</button><button>Lainnya</button></div>
 <div class="pos-layout">
  <div class="pos-products"><div id="kasirProducts" class="menu-grid">${menus.map(m=>`<div class="menu kasir-product" data-name="${m.name.toLowerCase()}" onclick="addOne('${m.id}')">
    <div class="menu-visual">${icons[m.id]||'🍽️'}</div><h3>${m.name}</h3><div class="price">${rupiah(m.price)}</div>
    <div class="menu-foot"><span class="muted">${cartQty(m.id)?cartQty(m.id)+' pcs dipilih':'Tap untuk tambah'}</span><button class="add-btn" onclick="event.stopPropagation();addOne('${m.id}')">+</button></div>
    ${cartQty(m.id)?`<div class="qtybox" onclick="event.stopPropagation()"><button onclick="changeQty('${m.id}',-1)">−</button><input type="number" min="1" value="${cartQty(m.id)}" onclick="event.stopPropagation()" onchange="setQty('${m.id}',this.value)"><button onclick="changeQty('${m.id}',1)">+</button></div>`:''}
  </div>`).join('')}</div>
   <div class="card" style="margin-top:14px"><div class="section-title"><h3>Tambah item manual</h3><span class="muted">Untuk pesanan di luar menu</span></div>
    <div class="form-grid"><div><label>Nama item</label><input id="customName" placeholder="Contoh: Es Teh"></div><div><label>Harga</label><input id="customPrice" type="number" placeholder="3000"></div><div><label>Qty</label><input id="customQty" type="number" min="1" value="1"></div></div>
    <button class="btn" onclick="addCustom()">＋ Tambah Manual</button>
   </div>
  </div>
  <div class="card cart-panel"><div class="section-title"><h3>Pesanan</h3><span class="muted">${cart.reduce((s,x)=>s+x.qty,0)} pcs</span></div>
   ${cart.length?cart.map((x,i)=>`<div class="cart-item"><div><b>${x.name}</b><div class="muted">${x.qty} × ${rupiah(x.price)}</div></div><div style="text-align:right"><b>${rupiah(x.price*x.qty)}</b><br><button class="btn danger" onclick="removeCart(${i})">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada pesanan.</div>'}
   <div class="total-box"><span>Total</span><span class="total">${rupiah(cart.reduce((s,x)=>s+x.price*x.qty,0))}</span></div>
   <button class="btn orange" style="width:100%;padding:13px" onclick="saveTransaction()">▣ Bayar & Simpan</button>
   <button class="btn danger" style="width:100%" onclick="cart=[];render()">Kosongkan</button>
  </div>
 </div>`;
}
function filterKasir(q){q=q.toLowerCase();document.querySelectorAll('.kasir-product').forEach(x=>x.style.display=x.dataset.name.includes(q)?'block':'none')}

/* STOK */
function stok(){
 document.getElementById('stok').innerHTML=`
 <div class="section-title"><div><h2>Stok / Bahan</h2><div class="muted">Kelola daftar bahan yang digunakan usaha</div></div><button class="btn orange" onclick="document.getElementById('mn').focus()">＋ Tambah Bahan</button></div>
 <div class="card"><input placeholder="🔎 Cari bahan..." oninput="filterMaterials(this.value)"></div>
 <div class="card"><div class="section-title"><h3>Daftar bahan</h3><span class="muted">${state.materials.length} bahan</span></div>
  <div id="materialList" class="material-list">${state.materials.length?state.materials.map(m=>`<div class="material-item material-row" data-name="${m.name.toLowerCase()}"><span>🥣 ${m.name}</span><span>›</span></div>`).join(''):'<div class="empty">Belum ada bahan.</div>'}</div>
 </div>
 <div class="card"><h3>Tambah Bahan</h3><div class="form-grid"><div><label>Nama bahan</label><input id="mn" placeholder="Contoh: Keju"></div><div><label>Satuan</label><input id="mu" value="pcs" placeholder="pcs / kg / liter"></div></div><button class="btn green" onclick="addMaterial()">Tambah Bahan</button></div>`;
}
function filterMaterials(q){q=q.toLowerCase();document.querySelectorAll('.material-row').forEach(x=>x.style.display=x.dataset.name.includes(q)?'flex':'none')}
function addMaterial(){
 const n=document.getElementById('mn').value.trim(),u=document.getElementById('mu')?.value.trim()||'pcs';if(!n)return alert('Nama bahan wajib diisi.');
 if(state.materials.some(m=>m.name.toLowerCase()===n.toLowerCase()))return alert('Bahan tersebut sudah ada.');
 state.materials.push({name:n,unit:u,stock:0,price:0,min:0});save();render()
}
function delMaterial(i){if(confirm('Hapus bahan ini?')){state.materials.splice(i,1);save();render()}}

/* PEMASUKAN */
function pemasukan(){
 const total=state.transactions.reduce((s,t)=>s+(Number(t.total)||0),0);
 document.getElementById('pemasukan').innerHTML=`
 <div class="section-title"><div><h2>Pemasukan</h2><div class="muted">Riwayat penjualan yang tersimpan di PUMALA</div></div><button class="btn orange" onclick="show('kasir')">＋ Transaksi Baru</button></div>
 <div class="dashboard-grid">
  <div class="report-card green"><h3>Total Pemasukan</h3><div class="big">${rupiah(total)}</div><div class="mini">${state.transactions.length} transaksi</div></div>
  <div class="report-card blue"><h3>Transaksi Terbaru</h3><div class="big">${state.transactions.length}</div><div class="mini">seluruh transaksi tersimpan</div></div>
 </div>
 <div class="card" style="margin-top:16px"><div class="section-title"><h3>Daftar Pemasukan</h3><span class="muted">Terbaru di atas</span></div>
 ${state.transactions.length?`<div class="table-wrap"><table><tr><th>Tanggal</th><th>Detail</th><th>Total</th><th>Aksi</th></tr>${state.transactions.slice().reverse().map(t=>`<tr><td>${new Date(t.date).toLocaleString('id-ID')}</td><td>${(t.items||[]).map(x=>x.name+' × '+x.qty).join(', ')}</td><td><b>${rupiah(t.total)}</b></td><td><button class="btn danger" onclick="delTx(${t.id})">Hapus</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada transaksi.</div>'}</div>`;
}
function delTx(id){if(confirm('Hapus transaksi?')){state.transactions=state.transactions.filter(t=>t.id!=id);save();render()}}

/* PENGELUARAN */
function pengeluaran(){
 const options=state.materials.map((m,i)=>`<option value="${i}">${m.name}</option>`).join('');
 const total=state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
 document.getElementById('pengeluaran').innerHTML=`
 <div class="section-title"><div><h2>Pengeluaran</h2><div class="muted">Catat pembelian bahan dan biaya usaha</div></div><button class="btn orange" onclick="document.getElementById('expenseMaterial').focus()">＋ Tambah Pengeluaran</button></div>
 <div class="dashboard-grid"><div class="report-card red"><h3>Total Pengeluaran</h3><div class="big">${rupiah(total)}</div><div class="mini">${state.expenses.length} catatan</div></div></div>
 <div class="card"><div class="section-title"><h3>Tambah Pengeluaran</h3><span class="muted">Pilih dari Stok/Bahan</span></div>
  <div class="form-grid"><div><label>Bahan</label><select id="expenseMaterial">${options||'<option value="">Belum ada bahan</option>'}</select></div><div><label>Jumlah bahan</label><input id="expenseQty" type="number" min=".01" step=".01" value="1"></div><div><label>Total harga pembelian</label><input id="expenseAmount" type="number" min="0" placeholder="Contoh: 50000"></div></div>
  <button class="btn green" onclick="addExpense()">＋ Simpan Pengeluaran</button>
 </div>
 <div class="card"><div class="section-title"><h3>Daftar Pengeluaran</h3><span class="muted">Terbaru di atas</span></div>
 ${state.expenses.length?`<div class="table-wrap"><table><tr><th>Tanggal</th><th>Bahan</th><th>Jumlah</th><th>Nominal</th><th>Aksi</th></tr>${state.expenses.slice().reverse().map(e=>`<tr><td>${new Date(e.date).toLocaleString('id-ID')}</td><td>${e.materialName||e.name||'-'}</td><td>${e.qty??'-'} ${e.unit||''}</td><td><b>${rupiah(e.amount)}</b></td><td><button class="btn danger" onclick="delExp(${e.id})">Hapus</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada pengeluaran.</div>'}</div>`;
}
function addExpense(){
 const idx=Number(document.getElementById('expenseMaterial').value),qty=Number(document.getElementById('expenseQty').value),amount=Number(document.getElementById('expenseAmount').value);
 if(!state.materials[idx])return alert('Pilih bahan terlebih dahulu.');if(!(qty>0))return alert('Jumlah bahan harus diisi.');if(!(amount>0))return alert('Total harga pembelian harus diisi.');
 const material=state.materials[idx];material.stock=(Number(material.stock)||0)+qty;material.price=amount/qty;const id=Date.now();
 state.expenses.push({id,date:new Date().toISOString(),name:material.name,materialName:material.name,qty,unit:material.unit||'pcs',amount});
 state.stockMoves.push({date:new Date().toISOString(),type:'masuk',name:material.name,qty,expenseId:id});save();render();alert('Pengeluaran tersimpan.')
}
function delExp(id){
 const e=state.expenses.find(x=>x.id==id);if(!e)return;if(!confirm('Hapus pengeluaran ini? Stok akan dikurangi kembali sesuai jumlah bahan.'))return;
 if(e.materialName&&e.qty){const m=state.materials.find(x=>x.name===e.materialName);if(m)m.stock=Math.max(0,(Number(m.stock)||0)-Number(e.qty||0));state.stockMoves=state.stockMoves.filter(x=>x.expenseId!=id)}
 state.expenses=state.expenses.filter(x=>x.id!=id);save();render()
}

/* LAPORAN */
function localDateKey(date){const d=new Date(date);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return localDateKey(new Date())}
function reportData(from,to){
 const transactions=state.transactions.filter(t=>{const d=localDateKey(t.date);return d>=from&&d<=to});
 const expenses=state.expenses.filter(e=>{const d=localDateKey(e.date);return d>=from&&d<=to});
 const income=transactions.reduce((s,t)=>s+(Number(t.total)||0),0),expense=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
 return{transactions,expenses,income,expense}
}
function reportRows(d){
 const rows=[];d.transactions.forEach(t=>rows.push({date:t.date,type:'Pemasukan',detail:(t.items||[]).map(x=>x.name+' × '+x.qty).join(', '),amount:Number(t.total)||0}));
 d.expenses.forEach(e=>rows.push({date:e.date,type:'Pengeluaran',detail:e.materialName||e.name||'-',amount:-(Number(e.amount)||0)}));
 return rows.sort((a,b)=>new Date(b.date)-new Date(a.date))
}
function reportTable(d){const rows=reportRows(d);if(!rows.length)return '<div class="empty">Tidak ada data pada periode ini.</div>';return `<div class="table-wrap"><table><tr><th>Tanggal</th><th>Jenis</th><th>Detail</th><th>Nominal</th></tr>${rows.map(r=>`<tr><td>${new Date(r.date).toLocaleString('id-ID')}</td><td>${r.type}</td><td>${r.detail}</td><td><b>${rupiah(r.amount)}</b></td></tr>`).join('')}</table></div>`}
function dailySummary(from,to){
 const d=reportData(from,to),map={};d.transactions.forEach(t=>{const k=localDateKey(t.date);if(!map[k])map[k]={income:0,expense:0};map[k].income+=Number(t.total)||0});d.expenses.forEach(e=>{const k=localDateKey(e.date);if(!map[k])map[k]={income:0,expense:0};map[k].expense+=Number(e.amount)||0});
 const keys=Object.keys(map).sort().reverse();if(!keys.length)return '<div class="empty">Belum ada data harian.</div>';
 return `<div class="table-wrap"><table><tr><th>Tanggal</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo</th></tr>${keys.map(k=>`<tr><td>${new Date(k+'T00:00:00').toLocaleDateString('id-ID')}</td><td>${rupiah(map[k].income)}</td><td>${rupiah(map[k].expense)}</td><td><b>${rupiah(map[k].income-map[k].expense)}</b></td></tr>`).join('')}</table></div>`
}
function laporan(){
 const today=todayKey(),todayData=reportData(today,today),d=new Date();d.setDate(d.getDate()-6);const from7=localDateKey(d);
 document.getElementById('laporan').innerHTML=`
 <div class="section-title"><div><h2>Laporan</h2><div class="muted">Pantau pemasukan, pengeluaran, dan saldo</div></div></div>
 <div class="dashboard-grid">
  <div class="report-card green"><h3>Pemasukan Hari Ini</h3><div class="big">${rupiah(todayData.income)}</div></div>
  <div class="report-card red"><h3>Pengeluaran Hari Ini</h3><div class="big">${rupiah(todayData.expense)}</div></div>
  <div class="report-card blue"><h3>Saldo Hari Ini</h3><div class="big">${rupiah(todayData.income-todayData.expense)}</div></div>
 </div>
 <div class="card" style="margin-top:16px"><div class="section-title"><h3>Detail Hari Ini</h3><span class="muted">${today}</span></div>${reportTable(todayData)}</div>
 <div class="card"><div class="section-title"><h3>Periode Laporan</h3><span class="muted">Pilih tanggal</span></div>
  <div class="form-grid"><div><label>Dari tanggal</label><input id="reportFrom" type="date" value="${from7}"></div><div><label>Sampai tanggal</label><input id="reportTo" type="date" value="${today}"></div><div><label>&nbsp;</label><button class="btn orange" style="width:100%" onclick="showPeriodReport()">Tampilkan Laporan</button></div></div>
  <button class="btn" onclick="exportReportCSV()">Export CSV</button><div id="periodReport" style="margin-top:15px"></div>
 </div>
 <div class="card"><div class="section-title"><h3>Ringkasan Per Hari</h3><span class="muted">7 hari terakhir</span></div>${dailySummary(from7,today)}</div>`;
 showPeriodReport()
}
function showPeriodReport(){
 const from=document.getElementById('reportFrom')?.value,to=document.getElementById('reportTo')?.value;if(!from||!to)return;if(from>to)return alert('Tanggal mulai tidak boleh setelah tanggal akhir.');
 const d=reportData(from,to);
 document.getElementById('periodReport').innerHTML=`<div class="dashboard-grid"><div class="report-card green"><h3>Total Pemasukan</h3><div class="big">${rupiah(d.income)}</div></div><div class="report-card red"><h3>Total Pengeluaran</h3><div class="big">${rupiah(d.expense)}</div></div><div class="report-card blue"><h3>Saldo</h3><div class="big">${rupiah(d.income-d.expense)}</div></div></div><div style="margin-top:14px">${reportTable(d)}</div>`
}
function exportReportCSV(){
 const from=document.getElementById('reportFrom')?.value,to=document.getElementById('reportTo')?.value;if(!from||!to)return;const d=reportData(from,to),rows=[['Tanggal','Jenis','Detail','Nominal']];
 reportRows(d).forEach(x=>rows.push([new Date(x.date).toLocaleString('id-ID'),x.type,x.detail,x.amount]));
 const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PUMALA_Laporan_'+from+'_sampai_'+to+'.csv';a.click()
}

/* DELIVERY */
function delivery(){
 document.getElementById('delivery').innerHTML=`
 <div class="section-title"><div><h2>Delivery</h2><div class="muted">Hitung ongkir dan total pesanan delivery</div></div><button class="btn orange" onclick="calcDelivery()">Hitung</button></div>
 <div class="card"><div class="form-grid"><div><label>Jarak (km)</label><input id="dk" type="number" step=".1" value="1"></div><div><label>Nilai pesanan</label><input id="do" type="number" value="30000"></div><div><label>Platform</label><select id="platform"><option>GoFood</option><option>Shoppe Food</option><option>Langsung</option></select></div></div><button class="btn orange" onclick="calcDelivery()">Hitung Ongkir</button><div id="dr" style="margin-top:15px"></div><p class="muted">Tarif: 0–1 km Rp3.000; 1–2 km Rp4.000; 2–3 km Rp5.000; 3–4 km Rp7.000; 4–5 km Rp9.000. Di atas 5 km perlu negosiasi. Minimum order Rp30.000.</p></div>
 <div class="card"><div class="section-title"><h3>Status Pesanan</h3><span class="muted">Tampilan ringkas</span></div><div class="timeline"><div class="timeline-item"><span>#0001 · Pesanan delivery</span><span class="status-pill">Siap diproses</span></div><div class="timeline-item"><span>#0002 · Pesanan delivery</span><span class="status-pill">Selesai</span></div></div></div>`;

function calcDelivery(){
 const k=Number(document.getElementById('dk').value),o=Number(document.getElementById('do').value);if(o<30000)return document.getElementById('dr').innerHTML='<b>Minimum order Rp30.000.</b>';
 const fee=k<=1?3000:k<=2?4000:k<=3?5000:k<=4?7000:k<=5?9000:null;
 document.getElementById('dr').innerHTML=fee===null?'<b>Jarak di atas 5 km: perlu negosiasi.</b>':`<div class="total-box"><span>Ongkir ${document.getElementById('platform').value}</span><span class="total">${rupiah(fee)}</span></div><div style="margin-top:10px"><b>Total + ongkir: ${rupiah(o+fee)}</b></div>`
}

/* BACKUP */
function backup(){
 document.getElementById('backup').innerHTML=`
 <div class="section-title"><div><h2>Backup</h2><div class="muted">Simpan dan pulihkan data PUMALA dengan aman</div></div></div>
 <div class="card backup-box"><div class="backup-icon">☁️</div><h2>Backup Data</h2><p class="muted">Simpan data usaha dari perangkat ini ke file JSON. Backup dapat diimpor kembali kapan saja.</p><button class="btn orange" onclick="downloadBackup()">Backup Sekarang</button></div>
 <div class="card"><h3>Import Backup</h3><label>Pilih file JSON</label><input type="file" id="imp" accept=".json" onchange="importBackup(event)"><p class="muted">Import akan mengganti data aplikasi saat ini dengan data dari file backup.</p></div>
 <div class="card"><div class="section-title"><h3>Status Penyimpanan</h3><span class="status-pill">${cloudReady?'Tersinkron ke cloud':'Menyiapkan...'}</span></div><p class="muted">Data PUMALA menggunakan Supabase agar dapat dibuka dari perangkat lain yang menggunakan aplikasi yang sama.</p></div>`;
}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='PUMALA_Backup.json';a.click()}
async function importBackup(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{try{const x=normalizeState(JSON.parse(r.result));if(!Array.isArray(x.transactions)||!Array.isArray(x.expenses)||!Array.isArray(x.materials))throw new Error('Format tidak sesuai');
 if(confirm('Ganti data saat ini dengan data dari backup?')){state=x;saveLocal();cloudReady=true;await save();render();alert('Backup berhasil diimpor dan disimpan ke cloud.')}}catch(err){console.error(err);alert('File backup tidak valid.')}}
 r.readAsText(f)
}

window.addEventListener('error',e=>{
 const old=document.getElementById('appError');if(old)return;
 const box=document.createElement('div');box.id='appError';box.style='position:fixed;left:12px;right:12px;bottom:90px;z-index:9999;padding:14px;background:#fff3cd;color:#664d03;border:1px solid #ffecb5;border-radius:12px;font-family:Arial';
 box.innerHTML='<b>Aplikasi mengalami error.</b><br>Silakan buka ulang aplikasi. Detail: '+String(e.message||'tidak diketahui');document.body.appendChild(box)
});

nav();render();loadCloud();startRealtime();
