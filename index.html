<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUMALA — APP</title>
<style>
*{box-sizing:border-box}
:root{
 --primary:#1677ff;--primary2:#075ed8;--navy:#09264d;--navy2:#0e3567;
 --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#7b8799;--line:#e6ebf2;
 --green:#12a866;--red:#ef4d5c;--orange:#f59e0b;--purple:#7c4dff;--cyan:#0ea5b7;
 --shadow:0 8px 28px rgba(20,48,84,.07)
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
body{min-height:100vh}
.payment-box{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8fbff}.payment-options{display:flex;gap:10px;margin-top:9px}.payment-option{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.payment-option input{margin-right:7px}.report-card.purple{border-left:4px solid var(--purple)}
header{
 height:72px;background:#fff;border-bottom:1px solid var(--line);position:fixed;left:230px;right:0;top:0;z-index:30;
 display:flex;align-items:center;padding:0 28px
}
.header-inner{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.brand{display:none}.brand-icon{font-size:28px}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}
.sync-dot{font-size:12px;color:#6b7789;white-space:nowrap;background:#f5f8fc;padding:8px 12px;border-radius:999px}
nav{
 position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,#09264d,#071d3b);
 color:#fff;z-index:40;padding:18px 12px;display:flex;flex-direction:column;gap:5px;overflow-y:auto
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 24px}
.sidebar-brand .logo{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:22px}
.sidebar-brand b{font-size:19px}.sidebar-brand span{display:block;color:#a9bdd8;font-size:10px;margin-top:2px}
nav button{
 border:0;background:transparent;color:#d7e3f3;padding:12px 13px;border-radius:11px;text-align:left;font-weight:600;
 display:flex;align-items:center;gap:10px;font-size:13px;width:100%
}
nav button:hover{background:rgba(255,255,255,.08)}nav button.active{background:#1677ff;color:#fff;box-shadow:0 5px 14px rgba(22,119,255,.25)}
.nav-spacer{flex:1}
.nav-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding-top:8px}
main{margin-left:230px;padding:96px 28px 35px;max-width:1450px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#fff,#f5f9ff);border-color:#dfeafa;padding:24px}
.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.section-title h2,.section-title h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat-card{padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 3px 12px rgba(20,48,84,.03)}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat{font-size:23px;font-weight:850}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.report-card{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column}
.report-card h3{margin:0 0 5px;font-size:15px}.report-card .big{font-size:24px;font-weight:850;margin-top:8px}.report-card .mini{font-size:12px;color:var(--muted)}
.report-card.green{border-top:4px solid var(--green)}.report-card.red{border-top:4px solid var(--red)}.report-card.blue{border-top:4px solid var(--primary)}.report-card.purple{border-top:4px solid var(--purple)}
.total-box{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border-radius:14px;background:#f4f8ff;border:1px solid #e0eaff;margin-top:14px}
.total{font-size:23px;font-weight:850;color:var(--primary2)}
.shortcut-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.shortcut{
 border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;min-height:108px;
 box-shadow:0 4px 13px rgba(20,48,84,.04);transition:.15s
}
.shortcut:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,48,84,.08)}
.shortcut:active{transform:scale(.98)}.shortcut-icon{font-size:25px}.shortcut h3{margin:8px 0 3px;font-size:14px}.shortcut p{margin:0;color:var(--muted);font-size:11px;line-height:1.35}
.menu-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1}
.category-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.category-row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:12px;font-weight:700}.category-row button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.pos-products{min-width:0}.cart-panel{position:sticky;top:88px;height:max-content}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.menu{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;box-shadow:0 4px 14px rgba(20,48,84,.05);overflow:hidden}
.menu-visual{height:108px;border-radius:13px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,#eaf3ff,#f8fbff);margin-bottom:11px}
.menu h3{margin:0 0 5px;font-size:14px;line-height:1.3}.price{font-weight:850;font-size:15px;color:var(--primary2)}
.menu-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.add-btn{width:34px;height:34px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:20px;font-weight:800}
.qtybox{display:flex;align-items:center;gap:7px;margin-top:10px}.qtybox button{width:34px;height:34px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:19px}.qtybox input{width:54px;text-align:center;padding:8px}
.cart-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.cart-item:last-child{border-bottom:0}
input,select{width:100%;padding:11px 12px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1677ff18}
label{display:block;font-size:11px;font-weight:750;margin:2px 0 5px;color:#526071}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:750;margin:3px 3px 3px 0;cursor:pointer}.btn.green{background:var(--green)}.btn.orange{background:var(--primary)}.btn.danger{background:var(--red)}.btn.blue{background:var(--primary)}
.material-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.material-item{padding:15px;background:#f8fafc;border:1px solid var(--line);border-radius:13px;font-weight:750;display:flex;justify-content:space-between}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{font-size:11px;color:#657185;background:#f8fafc}
.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timeline{display:grid;gap:10px}.timeline-item{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.status-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf7f0;color:#08783f;font-size:10px;font-weight:800}
.backup-box{text-align:center;padding:28px;border:2px dashed #cfdbea;border-radius:18px;background:#f9fbff}.backup-icon{font-size:48px}

/* lock screen */
.lock-screen{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#071d3b,#123f75);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-panel{width:min(360px,100%);text-align:center}.lock-title{font-size:25px;font-weight:800}.lock-subtitle{color:#b9cbe2;font-size:14px;margin:6px 0 18px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 25px}.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff}.pin-dot.filled{background:#fff}
.pin-error{height:20px;color:#ff9ea8;font-size:13px;margin-bottom:8px}.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:auto}.pin-btn{width:78px;height:78px;max-width:100%;justify-self:center;border-radius:50%;border:1px solid #52719a;background:#173c69;color:#fff;font-size:28px}.pin-btn:active{background:#2b5b8e;transform:scale(.96)}

@media(max-width:1050px){
 .shortcut-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos-layout{grid-template-columns:1fr}.cart-panel{position:static}.dashboard-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
 header{position:sticky;left:0;right:0;height:62px;padding:0 14px;top:0}.header-inner{justify-content:flex-end}
 nav{left:0;right:0;top:auto;bottom:0;width:auto;height:auto;max-height:76px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:row;gap:2px;border-top:1px solid #dbe2ec}
 .sidebar-brand,.nav-spacer,.nav-bottom{display:none}nav button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:7px 4px;font-size:9px;min-width:0;flex:1;text-align:center}nav button span{display:block}
 main{margin-left:0;padding:14px 10px 92px}.card{padding:15px;border-radius:15px}.hero{padding:19px}.hero h2{font-size:21px}
 .shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.shortcut{min-height:100px;padding:12px}
 .grid,.form-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 1fr;gap:9px}.menu{padding:9px}.menu-visual{height:92px;font-size:42px}.menu h3{font-size:13px}.price{font-size:14px}
 .material-list{grid-template-columns:1fr 1fr}.menu-toolbar{align-items:stretch;flex-direction:column}.sync-dot{font-size:10px;padding:7px 9px}
 .pos-layout{grid-template-columns:1fr}
}

.input-like{min-height:42px;display:flex;align-items:center;padding:10px 12px;border:1px solid #dce5ef;border-radius:12px;background:#f8fafc;font-weight:700}.mini-panel{padding:12px 14px;border-radius:12px;background:#f4f8ff;border:1px solid #dce8f8}.empty{padding:18px;text-align:center;color:#7b8798}

/* ===== PUMALA MODERN BUSINESS THEME ===== */
:root{
 --primary:#0f9f6e;--primary2:#087b57;--navy:#073b32;--navy2:#0b5a48;
 --bg:#f4f8f6;--card:#ffffff;--text:#17342d;--muted:#71817b;--line:#e0ebe6;

body{background:linear-gradient(180deg,#f6faf8 0%,#f1f7f4 100%);color:var(--text)}

.sidebar-brand b{font-size:20px;letter-spacing:.3px}.sidebar-brand span{color:#a9d8ca}
nav button{color:#dcefe9;border-radius:12px;padding:12px 13px;font-size:13px}

main{margin-left:250px;padding:100px 30px 38px;max-width:1480px}
.card{border-color:var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#ffffff 0%,#ecfaf5 100%);border-color:#d5eee5;padding:25px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:rgba(15,159,110,.08)}
.hero h2{font-size:26px;position:relative;z-index:1}.hero p{color:var(--muted)}
.section-title h2,.section-title h3{letter-spacing:-.2px}
.stat-card,.report-card,.shortcut,.menu{border-color:var(--line);box-shadow:0 5px 18px rgba(9,76,59,.05)}
.report-card{border-top-width:4px}.report-card.blue{border-top-color:#159aa6}.report-card.purple{border-top-color:#8064d9}
.report-card.green{border-top-color:#0f9f6e}.report-card.red{border-top-color:#e85b62}
.total-box{background:#effaf5;border-color:#d9eee5}.total{color:var(--primary2)}
.shortcut{border-radius:17px;background:linear-gradient(180deg,#fff,#fbfdfc)}
.shortcut:hover{box-shadow:0 12px 26px rgba(9,76,59,.09);border-color:#cfe8df}
.shortcut-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#eaf8f3;font-size:22px}
.category-row button{border-color:var(--line);background:#fff}.category-row button.active{background:var(--primary);border-color:var(--primary)}
.menu{border-radius:18px;padding:11px}.menu-visual{background:linear-gradient(135deg,#e9f8f2,#f7fcfa);border:1px solid #e0f0ea}.price{color:var(--primary2)}
.add-btn{background:var(--primary);box-shadow:0 5px 12px rgba(15,159,110,.18)}
.qtybox button{background:var(--navy)}
input,select{border-color:#d7e5df;border-radius:12px}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0f9f6e18}
.btn{border-radius:11px;background:var(--navy)}.btn.green,.btn.orange{background:var(--primary)}.btn.danger{background:var(--red)}
.material-item{background:#f7fbf9;border-color:#dceae5;border-radius:14px}
.table-wrap{border-color:var(--line);border-radius:15px}.table-wrap table th{background:#f3f8f6;color:#60736c}.table-wrap table tr:last-child td{border-bottom:0}

.backup-box{background:linear-gradient(135deg,#f8fcfa,#eef9f4);border-color:#cde8dd}

 nav{height:auto;max-height:78px;background:rgba(5,62,52,.98);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.10);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}

  const {error}=await supabaseClient.from('push_subscriptions').upsert({endpoint:subscription.endpoint,subscription:subscription,created_at:new Date().toISOString()},{onConflict:'endpoint'});
  if(error)throw error;
  localStorage.setItem('pumala_push_enabled','1');
  setPushStatus(true);
  return true;
 }catch(e){console.warn('Restore push gagal:',e);return false;}

let pollingTimer=null;
function startPollingFallback(){
 if(pollingTimer)return;
 pollingTimer=setInterval(async()=>{
  if(cloudReady){
   try{
    const {data,error}=await supabaseClient.from('pumala_state').select('id,data,updated_at').eq('id',1).maybeSingle();
    if(!error&&data&&data.data){
     const remote=normalizeState(data.data);
     if(JSON.stringify(remote)!==JSON.stringify(state)){
      const beforeIds=new Set((state.onlineOrders||[]).map(x=>x.id));
      state=remote;saveLocal();
      (state.onlineOrders||[]).filter(x=>!beforeIds.has(x.id)&&x.status==='baru').forEach(x=>{seenOnlineOrders.add(x.id);notifyNewOnlineOrder(x)});
      render();
     }
    }
   }catch(e){console.warn('Polling fallback error:',e)}
  }
 },12000);
}

function startRealtime(){
 if(realtimeStarted)return;realtimeStarted=true;
 try{
  const channel=supabaseClient.channel('pumala-sync');
  channel.on('postgres_changes',{event:'UPDATE',schema:'public',table:'pumala_state',filter:'id=eq.1'},payload=>{
   const remote=normalizeState(payload.new&&payload.new.data);
   if(!hasRealData(remote)&&hasRealData(state))return;
   const beforeIds=new Set((state.onlineOrders||[]).map(x=>x.id));
   state=remote;saveLocal();
   (state.onlineOrders||[]).filter(x=>!beforeIds.has(x.id)&&x.status==='baru').forEach(x=>{seenOnlineOrders.add(x.id);notifyNewOnlineOrder(x)});
   render();
  }).subscribe((status,err)=>{
   if(status==='CHANNEL_ERROR'||status==='CLOSED'||err){
    console.warn('Supabase Realtime not available in this environment. Falling back to HTTP polling.');
    startPollingFallback();
   }
  });
 }catch(err){
  console.warn('WebSocket connection not allowed in Canvas/sandbox, using HTTP polling fallback.');
  startPollingFallback();
 }
}

function dashboard(){
 const now = new Date();
 const dailyDate = now.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
 const todayK = todayKey();

 // Tanggal Bulan Ini & Bulan Lalu
 const thisMonthName = now.toLocaleDateString('id-ID', {month: 'long', year: 'numeric'});
 const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
 const lastMonthName = lastMonthDate.toLocaleDateString('id-ID', {month: 'long', year: 'numeric'});

 const thisYear = now.getFullYear();
 const thisMonth = now.getMonth();
 const lmYear = lastMonthDate.getFullYear();
 const lmMonth = lastMonthDate.getMonth();

 let totalCashIn = 0, totalQrisIn = 0;
 let totalExpense = 0;
 let totalExchanged = 0; // QRIS -> Cash

 let todayIncome = 0, todayExpense = 0;
 let thisMonthIncome = 0, thisMonthExpense = 0;
 let lastMonthIncome = 0, lastMonthExpense = 0;

 // Hitung Total dari seluruh transaksi untuk mendapatkan saldo berjalan akurat
 state.transactions.forEach(t => {
    const amt = Number(t.total) || 0;
    const isQris = t.payment === 'qris';
    const d = new Date(t.date);
    
    if (isQris) totalQrisIn += amt;
    else totalCashIn += amt;

    if (localDateKey(t.date) === todayK) todayIncome += amt;

    if (!isNaN(d.getTime())) {
       if (d.getFullYear() === thisYear && d.getMonth() === thisMonth) {
          thisMonthIncome += amt;
       } else if (d.getFullYear() === lmYear && d.getMonth() === lmMonth) {
          lastMonthIncome += amt;
       }
    }
 });

 // Hitung Pengeluaran
 state.expenses.forEach(e => {
    const amt = Number(e.amount) || 0;
    totalExpense += amt;
    const d = new Date(e.date);
    
    if (localDateKey(e.date) === todayK) todayExpense += amt;

    if (!isNaN(d.getTime())) {
       if (d.getFullYear() === thisYear && d.getMonth() === thisMonth) {
          thisMonthExpense += amt;

 const search=document.getElementById('materialSearch');
 if(search) search.addEventListener('change',()=>{const v=search.value.trim().toLowerCase();const i=state.materials.findIndex(m=>m.name.toLowerCase()===v);if(i>=0){document.getElementById('materialPicker').value=i;showMaterialInfo(i)}});

function showMaterialInfo(i){
 const box=document.getElementById('materialInfo');if(!box)return;
 if(i===''){box.className='empty';box.textContent='Pilih bahan untuk melihat keterangannya.';return;}
 const m=state.materials[Number(i)];if(!m)return;
 box.className='mini-panel';box.innerHTML=`<b>${m.name}</b><div class="muted">Satuan: ${m.unit||'pcs'}</div>`;
}
function addMaterial(){
 const n=document.getElementById('mn').value.trim(),u=document.getElementById('mu')?.value.trim()||'pcs';if(!n)return alert('Nama bahan wajib diisi.');
 if(state.materials.some(m=>m.name.toLowerCase()===n.toLowerCase()))return alert('Bahan tersebut sudah ada.');
 state.materials.push({name:n,unit:u,stock:0,price:0,min:0});save();render()
}

let activeFinanceTab = 'income';
let financeIncomeFilter = 'all';

function setIncomeFilter(filter){
 financeIncomeFilter = filter;
 renderFinanceIncomeList();
}

function renderFinanceIncomeList(){
 const listContainer = document.getElementById('financeIncomeList');
 if(!listContainer) return;

 let filtered = state.transactions.slice().reverse();
 if(financeIncomeFilter === 'cash'){
  filtered = filtered.filter(t => (t.payment || 'cash') === 'cash');
 } else if(financeIncomeFilter === 'qris'){
  filtered = filtered.filter(t => t.payment === 'qris');
 }

 if(!filtered.length){
  listContainer.innerHTML = `<div class="empty">Tidak ada transaksi yang cocok dengan filter ini.</div>`;
  return;
 }

 listContainer.innerHTML = `
  <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>Waktu</th>
      <th>Item Penjualan</th>
      <th>Metode</th>
      <th style="text-align:right">Total Pemasukan</th>
     </tr>
    </thead>
    <tbody>
     ${filtered.slice(0,50).map(t => {
      const isQris = t.payment === 'qris';
      const itemsText = (t.items || []).map(x => `${x.name} (${x.qty}x)`).join(', ') || 'Transaksi Kasir';
      const d = new Date(t.date);
      const timeStr = !isNaN(d.getTime()) ? d.toLocaleString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '-';
      return `
       <tr>
        <td style="white-space:nowrap">${timeStr}</td>
        <td><b>${itemsText}</b></td>
        <td>
         ${isQris ? '<span class="badge-qris">📱 QRIS</span>' : '<span class="badge-cash">💵 Cash</span>'}
        </td>
        <td style="text-align:right;font-weight:850;color:var(--primary2)">${rupiah(t.total)}</td>
       </tr>
      `;
     }).join('')}
    </tbody>
   </table>
  </div>
 `;
}

function financeTab(tabId) {
  activeFinanceTab = tabId;
  document.querySelectorAll('.finance-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.finance-panel').forEach(p => p.classList.remove('active'));
  
  const tEl = document.getElementById(`tab-${tabId}`);
  const pEl = document.getElementById(`finance-${tabId}`);
  if (tEl) tEl.classList.add('active');
  if (pEl) pEl.classList.add('active');
}

function fillExpenseName(val){
  const el = document.getElementById('expName');
  if(el) el.value = val;
}

function fillExpenseAmount(val){
  const el = document.getElementById('expAmount');
  if(el){
    const curr = Number(el.value) || 0;
    el.value = curr + val;
  }
}

function fillExchangeAmount(val){
  const el = document.getElementById('exchangeAmount');
  if(el) el.value = val;
}

function showFinanceNotice(msg, isSuccess=true){
 const old = document.getElementById('financeNotice');
 if(old) old.remove();
 const box = document.createElement('div');
 box.id = 'financeNotice';
 box.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:99999;padding:12px 20px;background:${isSuccess?'#0f9f6e':'#e85b62'};color:#fff;font-weight:800;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.2)`;
 box.textContent = msg;
 document.body.appendChild(box);
 setTimeout(() => box.remove(), 3000);
}

function addExpense() {
 const name = document.getElementById('expName')?.value.trim();
 const amt = Number(document.getElementById('expAmount')?.value);
 if (!name || !amt || amt <= 0) {
   showFinanceNotice('Mohon isi keterangan dan nominal pengeluaran dengan benar.', false);
   return;
 }
 state.expenses.push({ id: Date.now(), date: new Date().toISOString(), name, amount: amt });
 save();
 activeFinanceTab = 'expense';
 render();
 showFinanceNotice('✅ Pengeluaran berhasil disimpan!');
}

function deleteExpense(id) {
 state.expenses = state.expenses.filter(x => x.id !== id);
 save();
 activeFinanceTab = 'expense';
 render();
 showFinanceNotice('🗑️ Pengeluaran berhasil dihapus');
}

function addExchange() {
 const amt = Number(document.getElementById('exchangeAmount')?.value);
 if (!amt || amt <= 0) {
   showFinanceNotice('Mohon masukkan nominal penarikan yang valid.', false);
   return;
 }
 state.qrisExchanges.push({ id: Date.now(), date: new Date().toISOString(), amount: amt });
 save();
 activeFinanceTab = 'exchange';
 render();
 showFinanceNotice('✅ Penarikan QRIS berhasil dicatat!');
}

function deleteExchange(id) {
 state.qrisExchanges = state.qrisExchanges.filter(x => x.id !== id);
 save();
 activeFinanceTab = 'exchange';
 render();
 showFinanceNotice('🗑️ Riwayat penarikan dihapus');
}

function backup() {

  <div class="section-title"><h2>Backup Data</h2></div>
  <div class="card backup-box">
   <div class="backup-icon">💾</div>

   <p style="font-size:12px; color:var(--muted); margin-bottom:18px">Simpan data agar aman saat aplikasi diperbarui atau pindah perangkat.</p>
   <button class="btn blue" onclick="downloadBackup()">📥 Download Data Backup</button>
   <button class="btn orange" onclick="document.getElementById('fileInput').click()">📂 Restore File Data</button>
   <input type="file" id="fileInput" style="display:none" accept=".json" onchange="restoreBackup(event)">
  </div>
 `;
}

function downloadBackup() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
  const el = document.createElement('a');
  el.setAttribute("href", dataStr);
  el.setAttribute("download", "pumala_backup_" + new Date().getTime() + ".json");
  document.body.appendChild(el); el.click(); el.remove();
}
function restoreBackup(e) {
 const file = e.target.files[0]; if (!file) return;
 const reader = new FileReader();
 reader.onload = (ev) => {
  try {
   const parsed = JSON.parse(ev.target.result);
   state = normalizeState(parsed);
   save(); render(); alert('Restore berhasil!');
  } catch (err) { alert('File tidak valid'); }
 };
 reader.readAsText(file);
}

document.addEventListener('DOMContentLoaded', () => {
  loadCloud();
  startRealtime();
});
