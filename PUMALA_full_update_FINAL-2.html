<script>
const KEY='pumala_main_v1',PUMALA_PIN='230420';
const SUPABASE_URL='https://mgtnninfuktrkasybser.supabase.co';
const SUPABASE_KEY='sb_publishable_-Ucxdn9WA_iiBklEMhICeg_ykXFifZ1';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defaultMaterials=[['Mie','porsi'],['Telor','pcs'],['Sosis','pcs'],['Bakso','pcs'],['Sterofoam','pcs'],['Sedotan','pcs'],['Sendok','pcs'],['Kecap','botol'],['Saos','botol'],['Sayuran','kg'],['Cabai','kg'],['Minyak','liter'],['Gas','tabung'],['Air','liter']];
const defaultMenus=[{id:'ori',name:'Mie Get / Nyemek Ori',price:10000},{id:'bs',name:'Mie Get / Nyemek + Baso / Sosis',price:12000},{id:'both',name:'Mie Get / Nyemek + Baso + Sosis',price:13000}];
const emptyState=()=>({transactions:[],expenses:[],materials:defaultMaterials.map(x=>({name:x[0],unit:x[1],stock:0,price:0,min:0})),stockMoves:[],qrisExchanges:[],onlineOrders:[],menus:defaultMenus.map(x=>({...x}))});
function normalizeState(x){x=x&&typeof x==='object'?x:{};if(!Array.isArray(x.transactions))x.transactions=[];if(!Array.isArray(x.expenses))x.expenses=[];if(!Array.isArray(x.materials))x.materials=[];if(!Array.isArray(x.stockMoves))x.stockMoves=[];if(!Array.isArray(x.qrisExchanges))x.qrisExchanges=[];if(!Array.isArray(x.onlineOrders))x.onlineOrders=[];if(!Array.isArray(x.menus)||!x.menus.length)x.menus=defaultMenus.map(x=>({...x}));return x}
let state=normalizeState(JSON.parse(localStorage.getItem(KEY)||'null')||emptyState()),cloudReady=false,currentPage='dashboard',cart=[],activeFinanceTab='income',financeIncomeFilter='all',financeExpenseFilter='all',showIncomeHistory=false,showExpenseHistory=false,reportView='current',reportDay='',incomeFrom='',incomeTo='',expenseFrom='',expenseTo='';
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
async function save(){saveLocal();if(!cloudReady)return;const {error}=await supabaseClient.from('pumala_state').upsert({id:1,data:state,updated_at:new Date().toISOString()});if(error)console.error(error)}
function setSync(t){const e=document.getElementById('syncStatus');if(e)e.textContent=t}
async function loadCloud(){const local=normalizeState(JSON.parse(localStorage.getItem(KEY)||'null')||state);try{const {data,error}=await supabaseClient.from('pumala_state').select('id,data,updated_at').eq('id',1).maybeSingle();if(!error&&data&&data.data){const remote=normalizeState(data.data);if(remote.transactions.length||remote.expenses.length||remote.stockMoves.length||remote.materials.some(m=>Number(m.stock)||Number(m.price))){state=remote;saveLocal()}else if(local.transactions.length||local.expenses.length||local.stockMoves.length){state=local;cloudReady=true;await save();render();setSync('● Tersinkron');return}}else state=local}catch(e){state=local;setSync('● Offline / lokal')}cloudReady=true;saveLocal();setSync('● Tersinkron');render()}
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const localDateKey=d=>{d=new Date(d);if(isNaN(d))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const todayKey=()=>localDateKey(new Date());
reportDay=todayKey();
let enteredPin='';
function updatePinDots(){document.querySelectorAll('#pinDots .pin-dot').forEach((x,i)=>x.classList.toggle('filled',i<enteredPin.length))}
function pinPress(n){if(enteredPin.length>=6)return;enteredPin+=n;updatePinDots();if(enteredPin.length===6){if(enteredPin===PUMALA_PIN)document.getElementById('lockScreen').style.display='none';else{document.getElementById('pinError').textContent='Kata sandi salah.';setTimeout(()=>{enteredPin='';updatePinDots();document.getElementById('pinError').textContent=''},500)}}}
function pinClear(){enteredPin=enteredPin.slice(0,-1);updatePinDots()}function pinClearAll(){enteredPin='';updatePinDots()}
const navItems=[['dashboard','🏠','Dashboard'],['kasir','🛒','Kasir'],['stok','📦','Stok / Bahan'],['keuangan','💰','Keuangan'],['laporan','📊','Laporan'],['delivery','🛵','Delivery'],['riwayat','🧾','Riwayat'],['backup','💾','Backup']];
function nav(){const n=document.getElementById('nav');n.innerHTML=`<div class="sidebar-brand"><div class="logo">🍜</div><div><b>PUMALA</b><span>Kelola usaha, lebih mudah</span></div></div><div class="desktop-nav">${navItems.map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="show('${x[0]}')"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div>`}
function show(id){currentPage=id;render()}
function back(){show('dashboard')}
function render(){dashboard();kasir();stok();keuangan();laporan();delivery();riwayatPesanan();backup();nav();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(currentPage).classList.add('active')}
function dashboard(){
 const today=todayKey();
 const todayIn=state.transactions.filter(t=>localDateKey(t.date)===today).reduce((s,t)=>s+Number(t.total||0),0);
 const todayExp=state.expenses.filter(e=>localDateKey(e.date)===today).reduce((s,e)=>s+Number(e.amount||0),0);
 const cash=state.transactions.filter(t=>(t.payment||'cash')==='cash').reduce((s,t)=>s+Number(t.total||0),0);
 const qris=state.transactions.filter(t=>t.payment==='qris').reduce((s,t)=>s+Number(t.total||0),0);
 const ex=state.qrisExchanges.reduce((s,x)=>s+Number(x.amount||0),0);
 const allExp=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 const active=state.onlineOrders.filter(x=>x.status!=='selesai');
 document.getElementById('dashboard').innerHTML=`
 <div class="section-title"><h2>Dashboard</h2></div>
 <div class="card" style="padding:14px">
  <div class="section-title"><h3>🔔 Notifikasi Pesanan Online</h3><button class="btn blue" onclick="show('delivery')">Lihat Pesanan</button></div>
  ${active.length?active.slice().reverse().slice(0,5).map(o=>`<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${o.orderNo||o.order_no||'Pesanan Baru'}</b> · ${o.customerName||o.customer_name||'Pelanggan'}<div class="muted">${(o.items||[]).map(i=>i.name+' × '+i.qty).join(', ')||'Pesanan online'} · ${rupiah(o.total||0)}</div></div><span class="badge qris">BARU</span></div>`).join(''):`<div class="empty" style="padding:16px">Tidak ada pesanan online baru.</div>`}
 </div>
 <div class="card"><div class="section-title"><h3>⚡ Pintasan</h3></div><div class="shortcut-grid">${navItems.filter(x=>!['dashboard'].includes(x[0])).map(x=>`<button class="shortcut" onclick="show('${x[0]}')"><div class="shortcut-icon">${x[1]}</div><h3>${x[2]}</h3></button>`).join('')}</div></div>
 <div class="card"><div class="section-title"><h3>📅 Laporan Harian</h3><button class="btn blue" onclick="show('laporan')">Lihat Laporan</button></div><div class="finance-summary-grid"><div class="finance-summary-card green"><div><div class="summary-label">Pemasukan Hari Ini</div><div class="summary-value">${rupiah(todayIn)}</div></div><div class="summary-icon">📈</div></div><div class="finance-summary-card red"><div><div class="summary-label">Pengeluaran Hari Ini</div><div class="summary-value">${rupiah(todayExp)}</div></div><div class="summary-icon">💸</div></div></div><div class="total-box"><b>Hasil Hari Ini</b><b class="total">${rupiah(todayIn-todayExp)}</b></div></div>
 <div class="card"><div class="section-title"><h3>💰 Saldo Berjalan</h3></div><div class="finance-summary-grid"><div class="finance-summary-card green"><div><div class="summary-label">Cash</div><div class="summary-value">${rupiah(cash+ex-allExp)}</div></div><div class="summary-icon">💵</div></div><div class="finance-summary-card purple"><div><div class="summary-label">QRIS</div><div class="summary-value">${rupiah(qris-ex)}</div></div><div class="summary-icon">📱</div></div></div><div class="total-box"><b>Total Saldo</b><b class="total">${rupiah(cash+qris-allExp)}</b></div></div>`;
}
function addOne(id){const m=state.menus.find(x=>x.id===id);if(!m)return;const x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...m,qty:1});kasir()}
function changeQty(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);kasir()}
function setQty(id,v){const x=cart.find(x=>x.id===id);if(!x)return;const q=parseInt(v);if(!q)cart=cart.filter(y=>y.id!==id);else x.qty=q;kasir()}
function removeCart(i){cart.splice(i,1);kasir()}
function addCustom(){const n=document.getElementById('customName').value.trim(),p=Number(document.getElementById('customPrice').value),q=Number(document.getElementById('customQty').value)||1;if(!n||p<0||q<1)return alert('Lengkapi nama, harga, dan Qty.');cart.push({id:'custom-'+Date.now(),name:n+' (tambahan)',price:p,qty:q});kasir()}
function saveTransaction(){if(!cart.length)return alert('Pesanan masih kosong.');const payment=document.querySelector('input[name=paymentMethod]:checked')?.value||'cash';const total=cart.reduce((s,x)=>s+x.price*x.qty,0);state.transactions.push({id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total,payment});cart=[];save();alert('Transaksi tersimpan sebagai '+(payment==='qris'?'QRIS':'Cash')+'.');render()}
function kasir(){document.getElementById('kasir').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>Kasir</h2></div><div class="menu-grid">${state.menus.map(m=>{const q=cart.find(x=>x.id===m.id)?.qty||0;return `<div class="menu" onclick="addOne('${m.id}')"><div class="menu-visual">🍜</div><h3>${m.name}</h3><div class="price">${rupiah(m.price)}</div><div class="menu-foot"><span class="muted">${q?q+' pcs dipilih':'Tap untuk tambah'}</span><button class="add-btn" onclick="event.stopPropagation();addOne('${m.id}')">+</button></div>${q?`<div class="qtybox" onclick="event.stopPropagation()"><button onclick="changeQty('${m.id}',-1)">−</button><input type="number" value="${q}" min="1" onchange="setQty('${m.id}',this.value)"><button onclick="changeQty('${m.id}',1)">+</button></div>`:''}</div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>Tambah item manual</h3><div class="form-grid"><div><label>Nama</label><input id="customName" placeholder="Contoh: Es Teh"></div><div><label>Harga</label><input id="customPrice" type="number"></div><div><label>Qty</label><input id="customQty" type="number" min="1" value="1"></div></div><button class="btn" onclick="addCustom()">＋ Tambah</button></div><div class="card cart-panel"><h3>Pesanan</h3>${cart.length?cart.map((x,i)=>`<div class="cart-item"><div><b>${x.name}</b><div class="muted">${x.qty} × ${rupiah(x.price)}</div></div><div><b>${rupiah(x.price*x.qty)}</b><br><button class="btn danger" onclick="removeCart(${i})">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada pesanan.</div>'}<div class="total-box"><b>Total</b><b class="total">${rupiah(cart.reduce((s,x)=>s+x.price*x.qty,0))}</b></div><div class="form-grid"><label><input type="radio" name="paymentMethod" value="cash" checked> 💵 Cash</label><label><input type="radio" name="paymentMethod" value="qris"> 📱 QRIS</label></div><button class="btn blue" style="width:100%" onclick="saveTransaction()">▣ Bayar & Simpan</button><button class="btn danger" style="width:100%" onclick="cart=[];kasir()">Kosongkan</button></div>`}
function stok(){document.getElementById('stok').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>Stok / Bahan</h2></div><div class="card"><div class="material-list">${state.materials.map(m=>`<div class="material-item">${m.name}<span class="muted">${m.unit||'pcs'}</span></div>`).join('')}</div></div><div class="card"><h3>Tambah Bahan</h3><div class="form-grid"><div><label>Nama bahan</label><input id="mn" placeholder="Contoh: Keju"></div><div><label>Satuan</label><input id="mu" value="pcs"></div></div><button class="btn green" onclick="addMaterial()">＋ Tambah Bahan</button></div>`}
function addMaterial(){const n=document.getElementById('mn').value.trim(),u=document.getElementById('mu').value.trim()||'pcs';if(!n)return alert('Nama bahan wajib diisi.');if(state.materials.some(m=>m.name.toLowerCase()===n.toLowerCase()))return alert('Bahan sudah ada.');state.materials.push({name:n,unit:u,stock:0,price:0,min:0});save();render()}
function financeTab(t){activeFinanceTab=t;keuangan()}
function setIncomeFilter(v){financeIncomeFilter=v;showIncomeHistory=true;keuangan()}
function setExpenseFilter(v){financeExpenseFilter=v;showExpenseHistory=true;keuangan()}
function setIncomeDates(){incomeFrom=document.getElementById('incomeFrom')?.value||'';incomeTo=document.getElementById('incomeTo')?.value||'';showIncomeHistory=true;keuangan()}
function setExpenseDates(){expenseFrom=document.getElementById('expenseFrom')?.value||'';expenseTo=document.getElementById('expenseTo')?.value||'';showExpenseHistory=true;keuangan()}
function toggleIncomeHistory(){showIncomeHistory=!showIncomeHistory;keuangan()}
function toggleExpenseHistory(){showExpenseHistory=!showExpenseHistory;keuangan()}
function inDateRange(date,from,to){const d=localDateKey(date);return (!from||d>=from)&&(!to||d<=to)}
function deleteTransaction(id){const t=state.transactions.find(x=>String(x.id)===String(id));if(!t)return;if(!confirm('Hapus riwayat pemasukan ini? Saldo akan ikut berubah.'))return;state.transactions=state.transactions.filter(x=>String(x.id)!==String(id));save();keuangan();dashboard()}
function deleteExpense(id){if(!confirm('Hapus pengeluaran ini? Saldo akan ikut berubah.'))return;state.expenses=state.expenses.filter(x=>String(x.id)!==String(id));save();keuangan();dashboard()}
function addExpense(){const sel=document.getElementById('expenseMaterial'),qty=Number(document.getElementById('expenseQty').value),price=Number(document.getElementById('expensePrice').value);if(!sel?.value||qty<=0||price<=0)return alert('Pilih bahan, isi jumlah, dan harga pembelian.');const m=state.materials[Number(sel.value)];if(!m)return;state.expenses.push({id:Date.now(),date:new Date().toISOString(),name:m.name,materialName:m.name,unit:m.unit||'pcs',qty,unitPrice:price,amount:qty*price});save();document.getElementById('expenseQty').value=1;document.getElementById('expensePrice').value='';showExpenseHistory=true;render()}
function addExchange(){const a=Number(document.getElementById('exchangeAmount')?.value);if(a<=0)return alert('Nominal tidak valid.');state.qrisExchanges.push({id:Date.now(),date:new Date().toISOString(),amount:a});save();render()}
function deleteExchange(id){if(!confirm('Hapus pencairan QRIS ini?'))return;state.qrisExchanges=state.qrisExchanges.filter(x=>String(x.id)!==String(id));save();render()}
function keuangan(){
 const q=state.transactions.filter(t=>t.payment==='qris').reduce((s,t)=>s+Number(t.total||0),0),c=state.transactions.filter(t=>(t.payment||'cash')==='cash').reduce((s,t)=>s+Number(t.total||0),0),e=state.expenses.reduce((s,x)=>s+Number(x.amount||0),0),ex=state.qrisExchanges.reduce((s,x)=>s+Number(x.amount||0),0);
 let inc=state.transactions.slice().reverse();
 if(financeIncomeFilter==='cash')inc=inc.filter(t=>(t.payment||'cash')==='cash');
 if(financeIncomeFilter==='qris')inc=inc.filter(t=>t.payment==='qris');
 inc=inc.filter(t=>inDateRange(t.date,incomeFrom,incomeTo));
 let expenses=state.expenses.slice().reverse().filter(x=>inDateRange(x.date,expenseFrom,expenseTo));
 document.getElementById('keuangan').innerHTML=`
 <button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button>
 <div class="section-title"><h2>💰 Keuangan</h2></div>
 <div class="finance-tabs"><button class="finance-tab ${activeFinanceTab==='income'?'active':''}" onclick="financeTab('income')">💰 Pemasukan</button><button class="finance-tab ${activeFinanceTab==='expense'?'active':''}" onclick="financeTab('expense')">💸 Pengeluaran</button><button class="finance-tab ${activeFinanceTab==='exchange'?'active':''}" onclick="financeTab('exchange')">🔄 Tukar QRIS</button></div>
 <div class="finance-panel ${activeFinanceTab==='income'?'active':''}"><div class="card"><div class="history-toggle"><div><h3>📊 History Penjualan</h3><span class="muted">History disembunyikan sampai ditampilkan.</span></div><button class="btn blue" onclick="toggleIncomeHistory()">${showIncomeHistory?'Sembunyikan':'🔎 Tampilkan History'}</button></div>${showIncomeHistory?`<div class="filter-box"><b>Filter Tanggal</b><div class="form-grid" style="margin-top:8px;grid-template-columns:1fr 1fr"><div><label>Dari</label><input id="incomeFrom" type="date" value="${incomeFrom}" onchange="setIncomeDates()"></div><div><label>Sampai</label><input id="incomeTo" type="date" value="${incomeTo}" onchange="setIncomeDates()"></div></div><div class="chip-row"><button class="chip" onclick="incomeFrom='';incomeTo='';financeIncomeFilter='all';keuangan()">Semua Tanggal</button><button class="chip" onclick="financeIncomeFilter='cash';keuangan()">💵 Cash</button><button class="chip" onclick="financeIncomeFilter='qris';keuangan()">📱 QRIS</button></div></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pesanan</th><th>Metode</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${inc.length?inc.map(t=>`<tr><td>${new Date(t.date).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><b>${(t.items||[]).map(x=>`${x.name} (${x.qty}x)`).join(', ')}</b></td><td><span class="badge ${t.payment==='qris'?'qris':'cash'}">${t.payment==='qris'?'📱 QRIS':'💵 Cash'}</span></td><td><b>${rupiah(t.total)}</b></td><td><button class="btn danger" onclick="deleteTransaction('${String(t.id)}')">🗑️ Hapus</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Tidak ada data sesuai filter.</td></tr>`}</tbody></table></div>`:''}</div></div>
 <div class="finance-panel ${activeFinanceTab==='expense'?'active':''}"><div class="card"><h3>💸 Pembelian / Pengeluaran</h3><div class="muted" style="margin-bottom:12px">Pilih bahan langsung dari Stok / Bahan.</div><div class="form-grid"><div><label>Pilih Bahan</label><select id="expenseMaterial"><option value="">-- Pilih bahan dari stok --</option>${state.materials.map((m,i)=>`<option value="${i}">${m.name} (${m.unit||'pcs'})</option>`).join('')}</select></div><div><label>Jumlah Dibeli</label><input id="expenseQty" type="number" min="0.01" step="0.01" value="1"></div><div><label>Harga per Satuan (Rp)</label><input id="expensePrice" type="number" min="1" placeholder="Contoh: 15000"></div></div><button class="btn danger" onclick="addExpense()">＋ Simpan Pembelian</button></div><div class="card"><div class="history-toggle"><div><h3>📜 History Pembelian</h3><span class="muted">History disembunyikan sampai ditampilkan.</span></div><button class="btn blue" onclick="toggleExpenseHistory()">${showExpenseHistory?'Sembunyikan':'🔎 Tampilkan History'}</button></div>${showExpenseHistory?`<div class="filter-box"><b>Filter Tanggal</b><div class="form-grid" style="margin-top:8px;grid-template-columns:1fr 1fr"><div><label>Dari</label><input id="expenseFrom" type="date" value="${expenseFrom}" onchange="setExpenseDates()"></div><div><label>Sampai</label><input id="expenseTo" type="date" value="${expenseTo}" onchange="setExpenseDates()"></div></div><div class="chip-row"><button class="chip" onclick="expenseFrom='';expenseTo='';keuangan()">Semua Tanggal</button></div></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Bahan</th><th>Jumlah</th><th>Harga</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${expenses.length?expenses.map(x=>`<tr><td>${new Date(x.date).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><b>${x.name||x.materialName||'-'}</b></td><td>${x.qty||'-'} ${x.unit||''}</td><td>${rupiah(x.unitPrice||0)}</td><td><b style="color:var(--red)">${rupiah(x.amount)}</b></td><td><button class="btn danger" onclick="deleteExpense('${String(x.id)}')">🗑️ Hapus</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Tidak ada data sesuai filter.</td></tr>`}</tbody></table></div>`:''}</div></div>
 <div class="finance-panel ${activeFinanceTab==='exchange'?'active':''}><div class="card"><h3>🔄 Tukar QRIS ke Cash</h3><div class="muted">Saldo QRIS saat ini: <b>${rupiah(q-ex)}</b></div><div class="form-grid" style="margin-top:12px"><div><label>Nominal</label><input id="exchangeAmount" type="number"></div></div><button class="btn blue" onclick="addExchange()">Catat Penukaran</button></div><div class="card"><h3>📜 History Tukar QRIS</h3><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${state.qrisExchanges.length?state.qrisExchanges.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleString('id-ID')}</td><td>${rupiah(x.amount)}</td><td><button class="btn danger" onclick="deleteExchange('${String(x.id)}')">Hapus</button></td></tr>`).join(''):`<tr><td colspan="3" class="empty">Belum ada penukaran.</td></tr>`}</tbody></table></div></div></div>`;
}
function monthKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`}
function monthLabel(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function setReportView(v){reportView=v;render()}
function setReportDay(v){reportDay=v||todayKey();render()}
function reportData(list,from,to){return list.filter(x=>inDateRange(x.date,from,to))}
function laporan(){
 let title='',from='',to='';
 if(reportView==='previous'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;const last=new Date(d.getFullYear(),d.getMonth()+1,0);to=localDateKey(last);title=monthLabel(-1)}
 else if(reportView==='current'){const d=new Date();from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;to=todayKey();title=monthLabel(0)}
 else {from=reportDay;to=reportDay;title=new Date(reportDay+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
 const tx=reportData(state.transactions,from,to),exps=reportData(state.expenses,from,to),income=tx.reduce((s,x)=>s+Number(x.total||0),0),expense=exps.reduce((s,x)=>s+Number(x.amount||0),0),cash=tx.filter(x=>(x.payment||'cash')==='cash').reduce((s,x)=>s+Number(x.total||0),0),qris=tx.filter(x=>x.payment==='qris').reduce((s,x)=>s+Number(x.total||0),0);
 document.getElementById('laporan').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>📊 Laporan</h2></div><div class="finance-tabs"><button class="finance-tab ${reportView==='previous'?'active':''}" onclick="setReportView('previous')">Bulan Sebelumnya</button><button class="finance-tab ${reportView==='current'?'active':''}" onclick="setReportView('current')">Bulan Sekarang</button><button class="finance-tab ${reportView==='daily'?'active':''}" onclick="setReportView('daily')">Laporan Harian</button></div>${reportView==='daily'?`<div class="card"><label>Pilih Tanggal</label><input type="date" value="${reportDay}" onchange="setReportDay(this.value)"></div>`:''}<div class="section-title"><h3>${title}</h3></div><div class="finance-summary-grid"><div class="finance-summary-card green"><div><div class="summary-label">Pemasukan</div><div class="summary-value">${rupiah(income)}</div></div><div class="summary-icon">📈</div></div><div class="finance-summary-card red"><div><div class="summary-label">Pengeluaran</div><div class="summary-value">${rupiah(expense)}</div></div><div class="summary-icon">💸</div></div><div class="finance-summary-card blue"><div><div class="summary-label">Cash</div><div class="summary-value">${rupiah(cash)}</div></div><div class="summary-icon">💵</div></div><div class="finance-summary-card purple"><div><div class="summary-label">QRIS</div><div class="summary-value">${rupiah(qris)}</div></div><div class="summary-icon">📱</div></div></div><div class="total-box"><b>Hasil Bersih</b><b class="total">${rupiah(income-expense)}</b></div><div class="card"><h3>Rincian Penjualan</h3>${tx.length?`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pesanan</th><th>Metode</th><th>Total</th></tr></thead><tbody>${tx.slice().reverse().map(t=>`<tr><td>${new Date(t.date).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${(t.items||[]).map(i=>i.name+' × '+i.qty).join(', ')}</td><td>${t.payment==='qris'?'📱 QRIS':'💵 Cash'}</td><td><b>${rupiah(t.total)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada penjualan pada periode ini.</div>'}</div><div class="card"><h3>Rincian Pengeluaran</h3>${exps.length?`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Bahan</th><th>Total</th></tr></thead><tbody>${exps.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${x.name||x.materialName||'-'}</td><td><b>${rupiah(x.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada pengeluaran pada periode ini.</div>'}</div>`;
}
function delivery(){document.getElementById('delivery').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>🛵 Delivery</h2></div><div class="card"><div class="empty">Pesanan online dikelola melalui sistem delivery yang sudah terhubung pada data aplikasi.</div></div>`}
function riwayatPesanan(){document.getElementById('riwayat').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>🧾 Riwayat Pesanan Online</h2></div><div class="card">${state.onlineOrders.filter(x=>x.status==='selesai').length?state.onlineOrders.filter(x=>x.status==='selesai').map(o=>`<div style="padding:12px;border-bottom:1px solid var(--line)"><b>${o.orderNo||'-'}</b> · ${o.customerName||'-'}<br><span class="muted">${(o.items||[]).map(i=>i.name+' × '+i.qty).join(', ')}</span><br><b>${rupiah(o.total)}</b></div>`).join(''):'<div class="empty">Belum ada pesanan selesai.</div>'}</div>`}
function backup(){document.getElementById('backup').innerHTML=`<button class="btn back-dashboard" onclick="back()">← Kembali ke Dashboard</button><div class="section-title"><h2>💾 Backup Data</h2></div><div class="card"><button class="btn blue" onclick="downloadBackup()">⬇️ Download JSON</button><label class="btn" style="display:inline-block">⬆️ Import JSON<input type="file" accept=".json" hidden onchange="importBackup(this.files[0])"></label></div>`}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pumala-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=normalizeState(JSON.parse(r.result));save();render();alert('Backup berhasil dipulihkan.')}catch(e){alert('File JSON tidak valid.')}};r.readAsText(file)}
loadCloud();
</script>
